:root{
  --ink:#1B2830; --ink-2:#51616B; --paper:#FFFFFF; --line:#DCE3E5;
  --want:#B8246A; --been:#56752A; --you:#0E8FC7; --chip:#EEF3F4; --sight:#8A6A2E;
  --shadow:0 6px 24px rgba(20,40,55,.2);
  --display:"Marcellus","Palatino Linotype",Georgia,serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#E8EEF0; --ink-2:#9FB0B8; --paper:#151C1F; --line:#2C383E;
    --want:#E0578F; --been:#8DB255; --you:#4CC3F2; --chip:#222C30; --sight:#D9B26A;
    --shadow:0 6px 24px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E8EEF0; --ink-2:#9FB0B8; --paper:#151C1F; --line:#2C383E;
  --want:#E0578F; --been:#8DB255; --you:#4CC3F2; --chip:#222C30; --sight:#D9B26A;
  --shadow:0 6px 24px rgba(0,0,0,.55);
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;margin:0}
.app{display:flex;flex-direction:column;height:100%}
header{padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:var(--paper)}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:23px;margin:0}
h1 small{font-family:var(--body);font-size:12px;color:var(--ink-2);letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.sync{font-size:12px;color:var(--ink-2);white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:10px;padding:3px}
.tabs button{flex:1;border:0;background:none;color:var(--ink-2);font:600 14px var(--body);padding:7px 0;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--you);outline-offset:2px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto}
#mapView{overflow:hidden}
#map{position:absolute;inset:0;background:#AAD3DF}
.leaflet-container{font-family:var(--body)}
.leaflet-control-attribution{font-size:10px}
#map.adding{cursor:crosshair}
.filters{position:absolute;z-index:500;top:10px;left:16px;right:16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--body);padding:6px 11px;border-radius:999px;white-space:nowrap;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.here{position:absolute;z-index:500;top:50px;left:16px;max-width:calc(100% - 32px);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.here i{width:10px;height:10px;border-radius:50%;background:var(--you);flex:none}
.here span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zoom{position:absolute;z-index:500;right:16px;bottom:26px;display:flex;flex-direction:column;gap:6px}
.fab{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 20px var(--body);cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center;padding:0}
.fab.on{background:var(--want);color:#fff;border-color:var(--want)}
.addhint{position:absolute;z-index:600;left:16px;right:76px;bottom:26px;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}
.sheet{position:absolute;z-index:700;left:10px;right:10px;bottom:10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px 16px;max-height:60%;overflow:auto;display:flex;flex-direction:column;gap:9px}
.sheet .close{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;background:var(--chip);color:var(--ink);border-radius:50%;font-size:18px;cursor:pointer}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.sheet h2{font-family:var(--display);font-weight:400;font-size:23px;margin:0;padding-right:36px;line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.pill.open{background:color-mix(in srgb,var(--been) 18%,transparent);color:var(--been)}
.pill.shut{background:color-mix(in srgb,var(--want) 14%,transparent);color:var(--want)}
.blurb{margin:0;line-height:1.45;max-width:62ch}
.dist{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 4px;font:600 12.5px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;text-align:center;min-height:52px;justify-content:center}
.act b{font-size:17px;line-height:1}
.act.dir{background:var(--you);border-color:var(--you);color:#fff}
.act.want[aria-pressed="true"]{background:var(--want);border-color:var(--want);color:#fff}
.act.been[aria-pressed="true"]{background:var(--been);border-color:var(--been);color:#fff}
textarea,input[type=text]{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:15px var(--body);padding:8px 10px}
textarea{resize:vertical;min-height:40px}
.linkbtn{border:0;background:none;color:var(--want);font:600 13px var(--body);padding:4px 0;cursor:pointer;align-self:flex-start}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--body);padding:7px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.primary{border:0;background:var(--ink);color:var(--paper);font:700 15px var(--body);padding:11px;border-radius:10px;cursor:pointer}
.list{padding:8px 16px 32px;display:flex;flex-direction:column;gap:18px;max-width:760px;margin:0 auto}
.group h3{font-family:var(--display);font-weight:400;font-size:19px;margin:6px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.group h3 span{font-family:var(--body);font-size:12px;color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;color:var(--ink);font:inherit}
.row .nm{flex:1;min-width:0}
.row .nm strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{color:var(--ink-2);font-size:12.5px}
.row .d{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--ink-2)}
.dot.want{background:var(--want)} .dot.been{background:var(--been)}
.visit{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.visit time{font-family:var(--mono);font-size:13px;color:var(--ink-2);width:44px;flex:none}
.visit .n{flex:1;min-width:0;cursor:pointer}
.visit .num{width:22px;height:22px;border-radius:50%;background:var(--want);color:#fff;font:700 11px var(--body);display:grid;place-items:center;flex:none}
.visit button.rm{border:1px solid var(--line);background:none;color:var(--ink-2);border-radius:8px;font:600 12px var(--body);padding:5px 8px;cursor:pointer}
.visit button.rm.confirm{color:#fff;background:var(--want);border-color:var(--want)}
.empty{color:var(--ink-2);line-height:1.5;max-width:52ch}
.foot{font-size:12px;color:var(--ink-2);line-height:1.5}
.toast{position:fixed;z-index:900;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
/* markers */
.mk{background:none;border:0}
.mk i{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);display:grid;place-items:center;font:700 12px var(--body);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);box-sizing:border-box}
.mk.sight i{background:var(--sight);border-radius:5px;transform:translate(-50%,-50%) rotate(45deg)}
.mk.sight i span{transform:rotate(-45deg)}
.mk.food i{background:#C8541C;border-radius:50%}
.mk.drink i{background:#3A6F9E;border-radius:7px}
.mk.custom i{background:#5B6770;border-radius:50% 50% 50% 0;transform:translate(-50%,-80%) rotate(-45deg)}
.mk.custom i span{transform:rotate(45deg)}
.mk.want i{background:var(--want)}
.mk.been i{background:var(--been)}
.mk.sel i{width:30px;height:30px;font-size:15px;border-width:3px;box-shadow:0 0 0 5px color-mix(in srgb,var(--you) 40%,transparent),0 2px 6px rgba(0,0,0,.5)}
.mk b{position:absolute;left:50%;top:calc(50% + 15px);transform:translateX(-50%);white-space:nowrap;font:700 12px var(--body);color:#1B2830;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.youdot{background:none;border:0}
.youdot i{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);border-radius:50%;background:var(--you);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--you) 30%,transparent)}
.routebar{position:absolute;z-index:650;top:50px;left:16px;right:16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 10px 10px 14px;display:flex;align-items:center;gap:8px}
.rb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rb-to{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-num{font-family:var(--mono);font-size:14px;color:var(--you)}
.rb-from{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--body);padding:8px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.rb-btn.end{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.routebar:not([hidden]) ~ .here{display:none}
.youdot.live i{animation:none}
.youdot.live::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--you);opacity:.5;animation:ping 1.8s ease-out infinite}
@keyframes ping{to{transform:scale(3.2);opacity:0}}
#gpsBtn.on{background:var(--you);color:#fff;border-color:var(--you)}
#gpsBtn.follow{box-shadow:0 0 0 3px color-mix(in srgb,var(--you) 45%,transparent),var(--shadow)}
.zlow .mk:not(.sel) i{width:13px;height:13px;border-width:1.5px}
.zlow .mk:not(.sel) i span{display:none}
.legend{position:absolute;z-index:500;left:16px;bottom:26px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;display:flex;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.15);color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:4px}
.legend em{width:10px;height:10px;display:inline-block}
@media (min-width:700px){ .sheet{left:auto;width:380px;right:76px;bottom:16px;top:60px;max-height:none} }
</style>

const S={pins:{},visits:[],db:null,sel:null,filter:'all',adding:false,draft:null,tab:'map'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function metres(a,b){const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dg=(b.lng-a.lng)*t;const x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

function allPlaces(){
  const out=PLACES.slice();
  for(const [id,pin] of Object.entries(S.pins)) if(pin&&pin.custom) out.push({id,n:pin.name||'My pin',c:'custom',lat:pin.lat,lng:pin.lng,b:''});
  return out;
}
const byId=id=>allPlaces().find(p=>p.id===id);
const status=id=>(S.pins[id]&&S.pins[id].status)||'';
function here(){
  if(typeof G!=='undefined'&&G.pos) return {lat:G.pos.lat,lng:G.pos.lng,name:'you',placeId:null,live:true};
  if(!S.visits.length) return null;
  const v=S.visits[S.visits.length-1];
  return Date.now()-new Date(v.at).getTime()>6*3600e3?null:v;
}

// hours
const dayIdx=()=>(new Date().getDay()+6)%7;
const DAYN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const toMin=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
function segs(str){if(!str)return[];return str.split(', ').map(x=>{let [a,b]=x.split('–').map(toMin);if(b<=a)b+=1440;return[a,b]})}
function hoursInfo(p){
  if(p.h===H24) return {txt:'Open all hours',state:'open'};
  if(!p.h) return null;
  const d=dayIdx(),today=p.h[d],now=new Date(),n=now.getHours()*60+now.getMinutes();
  let open=segs(today).some(([a,b])=>n>=a&&n<b);
  if(!open&&n<360) open=segs(p.h[(d+6)%7]).some(([a,b])=>n+1440>=a&&n+1440<b);
  if(!today) return {txt:DAYN[d]+': closed',state:open?'open':'closed-today'};
  return {txt:DAYN[d]+' '+today,state:open?'open':'shut'};
}
function hoursPill(p){
  const h=hoursInfo(p); if(!h) return '';
  const lab={open:'Open now',shut:'Closed now','closed-today':'Closed today'}[h.state];
  return `<span class="pill ${h.state==='open'?'open':'shut'}">${lab}</span><span>${esc(h.txt)}</span>`;
}
function distTxt(p,short){
  const h=here(); if(!h||h.placeId===p.id) return '';
  const m=metres(h,p), mins=Math.max(1,Math.round(m*1.3/80));
  const mm=m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km';
  return short?mm:`${mm} from ${h.name} in a straight line · roughly ${mins} min on foot`;
}

// storage
const LS='rethymno-map-v1';
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){S.pins=d.pins||{};S.visits=d.visits||[]}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({pins:S.pins,visits:S.visits}))}catch(e){}}
const chains={};
function queue(path,fn){
  chains[path]=(chains[path]||Promise.resolve()).then(fn).catch(err=>{
    if(err&&err.code==='revoked'){S.db=null;setSync('Saving on this phone only')}
    toast(err&&err.code==='quota_exceeded'?'Storage is full. Remove some old check ins.':'Could not save that. Try again in a moment.');
  });
}
function setSync(t){$('sync').textContent=t}
function setPin(id,patch){
  const next={...(S.pins[id]||{}),...patch,updatedAt:new Date().toISOString()};
  const drop=!next.custom&&!next.status&&!(next.note||'').trim();
  if(drop) delete S.pins[id]; else S.pins[id]=next;
  saveLocal(); renderAll();
  if(S.db){const ref=S.db.doc('pins/'+id);queue('pins/'+id,()=>drop?ref.delete():ref.set(next))}
}
function removePin(id){
  delete S.pins[id]; saveLocal(); if(S.sel===id)S.sel=null; renderAll();
  if(S.db) queue('pins/'+id,()=>S.db.doc('pins/'+id).delete());
}
function checkIn(p){
  const v={placeId:p.id,name:p.n,lat:p.lat,lng:p.lng,at:new Date().toISOString()};
  const id='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  S.visits.push({id,...v}); saveLocal();
  if(status(p.id)!=='been') setPin(p.id,{status:'been'}); else renderAll();
  if(S.db) queue('visits/'+id,()=>S.db.doc('visits/'+id).set(v));
  toast('Checked in at '+p.n);
}
function removeVisit(id){
  S.visits=S.visits.filter(v=>v.id!==id); saveLocal(); renderAll();
  if(S.db) queue('visits/'+id,()=>S.db.doc('visits/'+id).delete());
}
function initStore(){loadLocal();renderAll();setSync('Saved on this phone')}

const R={grid:null,w:0,h:0,loading:null,to:null,from:null,picking:false,layer:L.layerGroup().addTo(map),dist:0};
const GX0=148887*256, GY0=103500*256, WORLD=256*Math.pow(2,18), CELL_M=2*156543.03*Math.cos(35.37*Math.PI/180)/Math.pow(2,18);

function loadGrid(){
  if(R.loading) return R.loading;
  R.loading=new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{try{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const d=x.getImageData(0,0,img.width,img.height).data;const g=new Uint8Array(img.width*img.height);for(let i=0;i<g.length;i++){const v=d[i*4];g[i]=v>150?2:v>50?1:0}R.grid=g;R.w=img.width;R.h=img.height;res()}catch(e){rej(e)}};

function snapCell(cx,cy){
  const {grid,w,h}=R;
  for(let r=0;r<260;r++){
    let best=-1,bd=1e9;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
      const x=cx+dx,y=cy+dy; if(x<0||y<0||x>=w||y>=h)continue;

function astar(s,t){

function simplify(pts,tol){

function startRoute(p){

  if(h&&h.live){R.from={lat:h.lat,lng:h.lng,name:'your location',live:true};runRoute()}

function askStart(){
  R.picking=true; S.sel=null; renderSheet();
  $('addHint').textContent='Tap where you are now, on the street or on a pin.'; $('addHint').hidden=false; $('map').classList.add('adding');
  loadGrid().catch(()=>{});

async function runRoute(quiet){
  $('addHint').textContent='Tap the map where you want the pin.';
  if(!quiet) showRouteBar('Working out the route…');
  R.lastRouteAt={lat:R.from.lat,lng:R.from.lng};
  try{await loadGrid()}catch(e){showRouteBar('Could not load the street data. Use Open in Google Maps instead.',true);return}
  const [sx,sy]=toCell(R.from.lat,R.from.lng),[tx,ty]=toCell(R.to.lat,R.to.lng);
  const s=snapCell(sx,sy),t=snapCell(tx,ty);
  if(s<0||t<0){showRouteBar('That point is off the map area. Pick a start in the old town.',true);return}
  await new Promise(r=>setTimeout(r,20));
  const path=astar(s,t);
  if(!path){showRouteBar('No walking route found between those points.',true);return}
  let d=0;for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];d+=((a%R.w)!==(b%R.w)&&((a/R.w)|0)!==((b/R.w)|0))?1.414:1}

  const cells=simplify(path.map(i=>[i%R.w,(i/R.w)|0]),1.2);
  const ll=cells.map(([x,y])=>toLatLng(x,y));
  ll.unshift([R.from.lat,R.from.lng]); ll.push([R.to.lat,R.to.lng]);
  R.layer.clearLayers();
  L.polyline(ll,{color:'#ffffff',weight:10,opacity:.95,lineJoin:'round',lineCap:'round'}).addTo(R.layer);
  const line=L.polyline(ll,{color:'#0E8FC7',weight:6,opacity:1,lineJoin:'round',lineCap:'round'}).addTo(R.layer);
  if(!R.from.live) L.circleMarker([R.from.lat,R.from.lng],{radius:8,color:'#fff',weight:3,fillColor:'#0E8FC7',fillOpacity:1}).addTo(R.layer);
  L.circleMarker([R.to.lat,R.to.lng],{radius:9,color:'#fff',weight:3,fillColor:'#1B2830',fillOpacity:1}).addTo(R.layer);

}
function showRouteBar(msg,err){

  if(msg){el.innerHTML=`<div class="rb-main"><span class="rb-to">${esc(msg)}</span></div><button class="rb-btn" data-r="end">${err?'Close':'Cancel'}</button>`;return}
  const m=Math.round(R.dist/10)*10, mins=Math.max(1,Math.round(R.dist/75));
  el.innerHTML=`<div class="rb-main"><span class="rb-to">To ${esc(R.to.name)}</span><span class="rb-num">${m<1000?m+' m':(m/1000).toFixed(1)+' km'} · ${mins} min walk</span><span class="rb-from">From ${esc(R.from.name)}</span></div>

}

function visible(p){
  const st=status(p.id),f=S.filter;
  if(f==='all') return true;
  if(f==='want'||f==='been') return st===f;
  if(f==='mine') return p.c==='custom';
  return p.c===f;
}
function todaysTrail(){
  if(!S.visits.length) return [];
  const last=new Date(S.visits[S.visits.length-1].at).toDateString();
  return S.visits.filter(v=>new Date(v.at).toDateString()===last);
}
function drawMap(){

function mergeOSM(list){
  let added=0;
  for(const o of list){
    if(!o||!o.n) continue;
    const f1=fold(o.n), f2=fold(o.alt);
    const dup=PLACES.find(p=>{
      if(metres(p,o)>60) return false;
      const fp=fold(p.n); if(!fp) return false;
      return fp===f1||fp===f2||(f1&&(fp.includes(f1)||f1.includes(fp)))||(f2&&(fp.includes(f2)||f2.includes(fp)))||(fp.split(' ')[0]&&fp.split(' ')[0].length>3&&(fp.split(' ')[0]===f1.split(' ')[0]||fp.split(' ')[0]===f2.split(' ')[0]));
    });
    if(dup){ if(!dup.oh&&o.oh) dup.oh=o.oh; if(!dup.web&&o.web) dup.web=o.web; continue }
    if(PLACES.some(p=>p.id===o.id)) continue;
    PLACES.push(o); added++;
  }
  return added;
}

async function loadOSM(){
  let cached=null; try{cached=JSON.parse(localStorage.getItem(OSM_KEY)||'null')}catch(e){}
  if(cached&&cached.items){const n=mergeOSM(cached.items);renderAll();if(Date.now()-cached.at<86400000){return}}
  for(const u of OSM_URLS){
    try{
      const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),30000);
      const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(OSM_Q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});
      clearTimeout(tm); if(!r.ok) continue;
      const j=await r.json(); const items=(j.elements||[]).map(osmToPlace).filter(Boolean);
      if(!items.length) continue;
      try{localStorage.setItem(OSM_KEY,JSON.stringify({at:Date.now(),items}))}catch(e){}
      const n=mergeOSM(items); renderAll();
      if(n) toast('Added '+n+' new places from OpenStreetMap');
      return;
    }catch(e){}
  }
  if(!cached) toast('Could not load the extra places. Check your signal and reopen the page.');
}

// ---------- live GPS ----------
const G={pos:null,acc:0,watch:null,follow:true,track:[],marker:null,circle:null,trackLayer:L.layerGroup().addTo(map)};
try{G.track=JSON.parse(localStorage.getItem('rethymno-track')||'[]')}catch(e){G.track=[]}
function todaysTrack(){const d=new Date().toDateString();return G.track.filter(p=>new Date(p.t).toDateString()===d)}
function drawTrack(){G.trackLayer.clearLayers();const tt=todaysTrack();if(tt.length>1)L.polyline(tt.map(p=>[p.lat,p.lng]),{color:'#B8246A',weight:4,opacity:.7}).addTo(G.trackLayer)}
function startGPS(){
  if(!navigator.geolocation){toast('This browser cannot share location.');return}
  if(G.watch!==null) return;
  G.watch=navigator.geolocation.watchPosition(onPos,err=>{
    navigator.geolocation.clearWatch(G.watch);G.watch=null;$('gpsBtn').classList.remove('on','follow');
    toast(err.code===1?'Location is switched off for this page. Allow it in your browser settings, then tap ◎.':'Still looking for GPS. Tap ◎ to try again.');
  },{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
}
function onPos(p){
  const ll={lat:p.coords.latitude,lng:p.coords.longitude}, first=!G.pos; G.pos=ll; G.acc=p.coords.accuracy;
  if(!G.marker){G.marker=L.marker([ll.lat,ll.lng],{icon:L.divIcon({className:'youdot live',html:'<i></i>',iconSize:[24,24]}),interactive:false,keyboard:false,zIndexOffset:3000}).addTo(map);G.circle=L.circle([ll.lat,ll.lng],{radius:G.acc,color:'#0E8FC7',weight:1,fillOpacity:.08,interactive:false}).addTo(map)}
  else{G.marker.setLatLng([ll.lat,ll.lng]);G.circle.setLatLng([ll.lat,ll.lng]).setRadius(G.acc)}
  const last=G.track[G.track.length-1];
  if(G.acc<50&&(!last||metres(last,ll)>12)){G.track.push({lat:+ll.lat.toFixed(6),lng:+ll.lng.toFixed(6),t:Date.now()});if(G.track.length>6000)G.track.splice(0,G.track.length-6000);try{localStorage.setItem('rethymno-track',JSON.stringify(G.track))}catch(e){};drawTrack();if(S.tab==='trail')renderTrail()}
  $('gpsBtn').classList.add('on');$('gpsBtn').classList.toggle('follow',G.follow);
  if(G.follow&&BOUNDS.pad(0.2).contains([ll.lat,ll.lng])) map.panTo([ll.lat,ll.lng],{animate:!first});
  if(first&&!BOUNDS.pad(0.2).contains([ll.lat,ll.lng])) toast("You're outside the old town map area right now.");
  if(R.to&&R.from&&R.from.live&&(!R.lastRouteAt||metres(R.lastRouteAt,ll)>15)){R.from={lat:ll.lat,lng:ll.lng,name:'your location',live:true};runRoute(true)}
  if(first) renderAll(); else if(S.sel) renderSheet();
  const hp=$('herePill');hp.hidden=false;$('hereTxt').textContent='Live location on'+(G.acc>40?' (weak signal, ±'+Math.round(G.acc)+' m)':'');
}
$('gpsBtn').onclick=()=>{
  if(G.watch===null){G.follow=true;startGPS();return}
  G.follow=true;$('gpsBtn').classList.add('follow');
  if(G.pos) map.setView([G.pos.lat,G.pos.lng],Math.max(map.getZoom(),18));
};
map.on('dragstart',()=>{if(G.follow){G.follow=false;$('gpsBtn').classList.remove('follow')}});
drawTrack();

const dirURL=p=>'https://www.google.com/maps/dir/?api=1&travelmode=walking&destination='+p.lat.toFixed(6)+','+p.lng.toFixed(6)+(p.c!=='custom'&&!p.osm?'&destination_place_id='+encodeURIComponent(p.id):'');
let rmArmed=false;
function renderSheet(){
  const el=$('sheet');
  if(S.draft){
    const d=S.draft; el.hidden=false;
    el.innerHTML=`<button class="close" data-a="cancel" aria-label="Cancel">×</button>
      <span class="eyebrow">New pin</span><h2>Name this spot</h2>
      <input type="text" id="draftName" placeholder="e.g. Bakery with the blue door" value="${esc(d.name)}" maxlength="60">
      <div class="seg">
        <button data-s="want" aria-pressed="${d.status==='want'}">Want to go</button>
        <button data-s="been" aria-pressed="${d.status==='been'}">Been</button>
        <button data-s="" aria-pressed="${d.status===''}">Just a marker</button>
      </div>
      <label class="check"><input type="checkbox" id="draftHere" ${d.checkin?'checked':''}> I'm here now, add it to my trail</label>
      <button class="primary" data-a="savedraft">Save pin</button>`;
    return;
  }
  const p=S.sel&&byId(S.sel);
  if(!p){el.hidden=true;el.innerHTML='';return}
  const st=status(p.id), pin=S.pins[p.id]||{}, dist=distTxt(p);
  el.hidden=false;
  el.innerHTML=`<button class="close" data-a="close" aria-label="Close">×</button>
    <span class="eyebrow">${esc(p.t||CAT[p.c])}${p.pl?' · '+'€'.repeat(p.pl):''}</span>
    <h2>${esc(p.n)}</h2>
    <div class="meta">${p.r?`<span>★ ${p.r} <span style="opacity:.75">(${(p.rc||0).toLocaleString('en-GB')})</span></span>`:''}${hoursPill(p)}${!p.h&&p.oh?`<span>Hours: ${esc(p.oh)}</span>`:''}</div>
    ${p.web?`<a class="linkbtn" href="${esc(p.web)}" target="_blank" rel="noopener" style="color:var(--you);text-decoration:none">Website ↗</a>`:''}
    ${p.b?`<p class="blurb">${esc(p.b)}</p>`:''}
    ${dist?`<div class="dist">${esc(dist)}</div>`:''}
    <div class="actions">
      <button class="act dir" data-a="route"><b>➜</b>Walk here</button>
      <button class="act want" data-a="want" aria-pressed="${st==='want'}"><b>♥</b>Want to go</button>
      <button class="act been" data-a="been" aria-pressed="${st==='been'}"><b>✓</b>Been</button>
      <button class="act" data-a="checkin"><b>◉</b>I'm here</button>
    </div>
    <textarea id="note" rows="2" placeholder="Your note, e.g. book for Thursday, ask for a harbour table">${esc(pin.note||'')}</textarea>
    <a class="linkbtn" href="${dirURL(p)}" target="_blank" rel="noopener" style="color:var(--ink-2);text-decoration:none">Open in Google Maps ↗</a>
    ${p.c==='custom'?`<button class="linkbtn" data-a="rmpin">${rmArmed?'Tap again to remove this pin':'Remove this pin'}</button>`:''}`;
}
$('sheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-a],[data-s]'); if(!b)return;
  if(b.dataset.s!==undefined&&S.draft){S.draft.name=$('draftName').value;S.draft.checkin=$('draftHere').checked;S.draft.status=b.dataset.s;renderSheet();return}
  const a=b.dataset.a, p=S.sel&&byId(S.sel);
  if(a==='close'){S.sel=null;renderAll()}
  else if(a==='cancel'){S.draft=null;renderAll()}
  else if(a==='savedraft'){
    const d=S.draft, name=$('draftName').value.trim()||'My pin', ci=$('draftHere').checked;
    const id='c'+Date.now().toString(36), lat=+d.lat.toFixed(6), lng=+d.lng.toFixed(6);
    S.draft=null;
    setPin(id,{custom:true,name,lat,lng,status:d.status,note:''});
    S.sel=id;
    if(ci) checkIn({id,n:name,lat,lng});
    renderAll(); toast('Pin saved');
  }
  else if(a==='route'&&p) startRoute(p);
  else if(a==='want'&&p) setPin(p.id,{status:status(p.id)==='want'?'':'want'});
  else if(a==='been'&&p) setPin(p.id,{status:status(p.id)==='been'?'':'been'});
  else if(a==='checkin'&&p) checkIn(p);
  else if(a==='rmpin'&&p){if(rmArmed){rmArmed=false;removePin(p.id);toast('Pin removed')}else{rmArmed=true;renderSheet();setTimeout(()=>{rmArmed=false},4000)}}
});
$('sheet').addEventListener('change',e=>{
  if(e.target.id==='note'&&S.sel){const v=e.target.value.slice(0,500);if(v!==((S.pins[S.sel]||{}).note||''))setPin(S.sel,{note:v})}
});

// list
function renderList(){
  const ps=allPlaces(), h=here();
  const groups=[['want','Want to go',ps.filter(p=>status(p.id)==='want')],['been','Been',ps.filter(p=>status(p.id)==='been')],['sight','Sights',ps.filter(p=>p.c==='sight')],['food','Restaurants',ps.filter(p=>p.c==='food')],['drink','Cafés & bars',ps.filter(p=>p.c==='drink')],['custom','My pins',ps.filter(p=>p.c==='custom')]];
  let html='';
  for(const [g,title,items] of groups){
    if(!items.length&&g==='custom')continue;
    if(!items.length){html+=`<div class="group"><h3>${title}</h3><p class="empty">${g==='want'?'Nothing saved yet. Open any place and tap Want to go.':'Tap I\'m here or Been on a place and it lands here.'}</p></div>`;continue}
    if(h) items.sort((a,b)=>metres(h,a)-metres(h,b));
    html+=`<div class="group"><h3>${title}<span>${items.length}</span></h3>`+items.map(p=>{
      const st=status(p.id), hi=hoursInfo(p), note=(S.pins[p.id]||{}).note;
      const sub=[CAT[p.c], p.r?'★ '+p.r:'', hi&&hi.state!=='open'?({shut:'closed now','closed-today':'closed today'}[hi.state]):'', note?'“'+note+'”':''].filter(Boolean).join(' · ');
      return `<button class="row" data-go="${esc(p.id)}"><span class="dot ${st}"></span><span class="nm"><strong>${esc(p.n)}</strong><small>${esc(sub)}</small></span><span class="d">${distTxt(p,true)}</span></button>`}).join('')+'</div>';
  }
  html+=`<p class="foot">Ratings and opening hours from Google, pulled 27/09/2026; check before you walk over. Map and extra places © OpenStreetMap contributors.</p>`;
  $('list').innerHTML=html;
}
$('list').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)select(b.dataset.go,true)});

// trail
let armedVisit=null;
function gpsSummary(){
  if(typeof G==='undefined') return '';
  const tt=todaysTrack(); let d=0; for(let i=1;i<tt.length;i++) d+=metres(tt[i-1],tt[i]);
  if(!tt.length) return `<div class="group"><h3>Walked today</h3><p class="empty">Tap ◎ on the map and your walk is traced automatically while this page is open.</p></div>`;
  return `<div class="group"><h3>Walked today<span>${(d/1000).toFixed(2)} km by GPS</span></h3><p class="empty">Your route is the pink line on the map. It records while this page is open on your screen.</p><button class="linkbtn" data-cleartrack="1">${clearArmed?'Tap again to clear today\'s track':'Clear today\'s track'}</button></div>`;
}
let clearArmed=false;
function renderTrail(){
  const gs=gpsSummary();
  if(!S.visits.length){$('trail').innerHTML=gs+`<div class="group"><h3>My check ins</h3><p class="empty">Each time you tap <strong>I'm here</strong> on a place, it's logged here with the time, and today's stops are joined up on the map.</p></div>`;return}
  const days={};
  S.visits.forEach(v=>{const k=new Date(v.at).toDateString();(days[k]=days[k]||[]).push(v)});
  const keys=Object.keys(days).sort((a,b)=>new Date(b)-new Date(a));
  $('trail').innerHTML=gs+keys.map(k=>{
    const vs=days[k]; let dist=0; for(let i=1;i<vs.length;i++) dist+=metres(vs[i-1],vs[i]);
    const label=new Date(vs[0].at).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
    return `<div class="group"><h3>${label}<span>${vs.length} stop${vs.length>1?'s':''}${dist?' · '+(dist/1000).toFixed(1)+' km point to point':''}</span></h3>`+
      vs.map((v,i)=>`<div class="visit"><span class="num">${i+1}</span><time>${new Date(v.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</time><span class="n" data-go="${esc(v.placeId)}">${esc(v.name)}</span><button class="rm ${armedVisit===v.id?'confirm':''}" data-rm="${esc(v.id)}">${armedVisit===v.id?'Remove?':'×'}</button></div>`).join('')+'</div>';
  }).join('');
}
$('trail').addEventListener('click',e=>{
  const ct=e.target.closest('[data-cleartrack]');
  if(ct){if(clearArmed){clearArmed=false;const d=new Date().toDateString();G.track=G.track.filter(p=>new Date(p.t).toDateString()!==d);try{localStorage.setItem('rethymno-track',JSON.stringify(G.track))}catch(_){};drawTrack();renderTrail()}else{clearArmed=true;renderTrail();setTimeout(()=>{clearArmed=false;renderTrail()},4000)}return}
  const r=e.target.closest('[data-rm]');
  if(r){const id=r.dataset.rm;if(armedVisit===id){armedVisit=null;removeVisit(id)}else{armedVisit=id;renderTrail();setTimeout(()=>{if(armedVisit===id){armedVisit=null;renderTrail()}},4000)}return}
  const g=e.target.closest('[data-go]'); if(g&&byId(g.dataset.go)) select(g.dataset.go,true);
});

// tabs
function setTab(t){
  S.tab=t;
  ['map','list','trail'].forEach(x=>{$('tab-'+x).setAttribute('aria-selected',x===t);$(x+'View').hidden=x!==t});
  if(t==='map') setTimeout(()=>map.invalidateSize(),0);
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
new ResizeObserver(()=>map.invalidateSize()).observe($('map'));

function renderAll(){
  renderFilters(); drawMap(); renderSheet(); renderList(); renderTrail();
  const h=here();
  $('herePill').hidden=!h;
  if(h&&h.live) $('hereTxt').textContent='Live location on'+(G.acc>40?' (weak signal, ±'+Math.round(G.acc)+' m)':'');
