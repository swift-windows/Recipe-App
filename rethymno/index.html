:root{
  --ink:#1B2830; --ink-2:#51616B; --paper:#FFFFFF; --line:#DCE3E5;
  --want:#B8246A; --been:#56752A; --you:#0E8FC7; --chip:#EEF3F4; --sight:#8A6A2E;
  --shadow:0 6px 24px rgba(20,40,55,.2);
  --display:"Marcellus","Palatino Linotype",Georgia,serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#E8EEF0; --ink-2:#9FB0B8; --paper:#151C1F; --line:#2C383E;
    --want:#E0578F; --been:#8DB255; --you:#4CC3F2; --chip:#222C30; --sight:#D9B26A;
    --shadow:0 6px 24px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E8EEF0; --ink-2:#9FB0B8; --paper:#151C1F; --line:#2C383E;
  --want:#E0578F; --been:#8DB255; --you:#4CC3F2; --chip:#222C30; --sight:#D9B26A;
  --shadow:0 6px 24px rgba(0,0,0,.55);
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;margin:0}
.app{display:flex;flex-direction:column;height:100%}
header{padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:var(--paper)}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:23px;margin:0}
h1 small{font-family:var(--body);font-size:12px;color:var(--ink-2);letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.sync{font-size:12px;color:var(--ink-2);white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:10px;padding:3px}
.tabs button{flex:1;border:0;background:none;color:var(--ink-2);font:600 14px var(--body);padding:7px 0;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--you);outline-offset:2px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto}
#mapView{overflow:hidden}
#map{position:absolute;inset:0;background:#AAD3DF}
.leaflet-container{font-family:var(--body)}
.leaflet-control-attribution{font-size:10px}
#map.adding{cursor:crosshair}
.msearch{position:absolute;z-index:660;top:10px;left:16px;right:16px}
#mapSearch{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:16px var(--body);padding:10px 14px;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.mres{margin-top:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:50vh;overflow:auto}
.mres button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:15px var(--body);padding:10px 12px;cursor:pointer}
.mres button small{color:var(--ink-2);font-size:12.5px;display:block}
.filters{position:absolute;z-index:500;top:58px;left:16px;right:16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--body);padding:6px 11px;border-radius:999px;white-space:nowrap;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.here{position:absolute;z-index:500;top:98px;left:16px;max-width:calc(100% - 32px);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.here i{width:10px;height:10px;border-radius:50%;background:var(--you);flex:none}
.here span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zoom{position:absolute;z-index:500;right:16px;bottom:26px;display:flex;flex-direction:column;gap:6px}
.fab{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 20px var(--body);cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center;padding:0}
.fab.on{background:var(--want);color:#fff;border-color:var(--want)}
.addhint{position:absolute;z-index:600;left:16px;right:76px;bottom:26px;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}

const CAT={sight:'Sight',food:'Restaurant',drink:'Café & bar',misc:'Shops & services',custom:'Your pin'};

const S={pins:{},visits:[],db:null,sel:null,filter:'all',adding:false,draft:null,tab:'map'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function metres(a,b){const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dg=(b.lng-a.lng)*t;const x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

function allPlaces(){
  const out=PLACES.slice();
  for(const [id,pin] of Object.entries(S.pins)) if(pin&&pin.custom) out.push({id,n:pin.name||'My pin',c:'custom',lat:pin.lat,lng:pin.lng,b:''});
  return out;
}
const byId=id=>allPlaces().find(p=>p.id===id);
const status=id=>(S.pins[id]&&S.pins[id].status)||'';
function here(){
  if(typeof G!=='undefined'&&G.pos) return {lat:G.pos.lat,lng:G.pos.lng,name:'you',placeId:null,live:true};
  if(!S.visits.length) return null;
  const v=S.visits[S.visits.length-1];
  return Date.now()-new Date(v.at).getTime()>6*3600e3?null:v;
}

// hours
const dayIdx=()=>(new Date().getDay()+6)%7;
const DAYN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const toMin=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
function segs(str){if(!str)return[];return str.split(', ').map(x=>{let [a,b]=x.split('–').map(toMin);if(b<=a)b+=1440;return[a,b]})}
function hoursInfo(p){
  if(p.h===H24) return {txt:'Open all hours',state:'open'};
  if(!p.h) return null;
  const d=dayIdx(),today=p.h[d],now=new Date(),n=now.getHours()*60+now.getMinutes();
  let open=segs(today).some(([a,b])=>n>=a&&n<b);
  if(!open&&n<360) open=segs(p.h[(d+6)%7]).some(([a,b])=>n+1440>=a&&n+1440<b);
  if(!today) return {txt:DAYN[d]+': closed',state:open?'open':'closed-today'};
  return {txt:DAYN[d]+' '+today,state:open?'open':'shut'};
}
function autoDesc(p){
  const kind=(p.t||CAT[p.c]).split(' · ');
  const what=kind[0]+(kind[1]?' serving '+kind[1]:'');
  if(p.c==='misc') return what+'.';
  return what+'. Not on Google, so there are no reviews to go on yet'+(p.oh?'; listed hours: '+p.oh:'')+'.';
}
function hoursPill(p){
  const h=hoursInfo(p); if(!h) return '';
  const lab={open:'Open now',shut:'Closed now','closed-today':'Closed today'}[h.state];
  return `<span class="pill ${h.state==='open'?'open':'shut'}">${lab}</span><span>${esc(h.txt)}</span>`;
}
function distTxt(p,short){
  const h=here(); if(!h||h.placeId===p.id) return '';
  const m=metres(h,p), mins=Math.max(1,Math.round(m*1.3/80));
  const mm=m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km';
  return short?mm:`${mm} from ${h.name} in a straight line · roughly ${mins} min on foot`;
}

// storage
const LS='rethymno-map-v1';
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){S.pins=d.pins||{};S.visits=d.visits||[]}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({pins:S.pins,visits:S.visits}))}catch(e){}}
const chains={};
function queue(path,fn){
  chains[path]=(chains[path]||Promise.resolve()).then(fn).catch(err=>{
    if(err&&err.code==='revoked'){S.db=null;setSync('Saving on this phone only')}
    toast(err&&err.code==='quota_exceeded'?'Storage is full. Remove some old check ins.':'Could not save that. Try again in a moment.');
  });
}
function setSync(t){$('sync').textContent=t}
function setPin(id,patch){
  const next={...(S.pins[id]||{}),...patch,updatedAt:new Date().toISOString()};
  const drop=!next.custom&&!next.status&&!(next.note||'').trim();
  if(drop) delete S.pins[id]; else S.pins[id]=next;
  saveLocal(); renderAll();
  if(S.db){const ref=S.db.doc('pins/'+id);queue('pins/'+id,()=>drop?ref.delete():ref.set(next))}
}
function removePin(id){
  delete S.pins[id]; saveLocal(); if(S.sel===id)S.sel=null; renderAll();
  if(S.db) queue('pins/'+id,()=>S.db.doc('pins/'+id).delete());
}
function checkIn(p){
  const v={placeId:p.id,name:p.n,lat:p.lat,lng:p.lng,at:new Date().toISOString()};
  const id='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  S.visits.push({id,...v}); saveLocal();
  if(status(p.id)!=='been') setPin(p.id,{status:'been'}); else renderAll();
  if(S.db) queue('visits/'+id,()=>S.db.doc('visits/'+id).set(v));
  toast('Checked in at '+p.n);
}
function removeVisit(id){
  S.visits=S.visits.filter(v=>v.id!==id); saveLocal(); renderAll();
  if(S.db) queue('visits/'+id,()=>S.db.doc('visits/'+id).delete());
}
function initStore(){loadLocal();renderAll();setSync('Saved on this phone')}

const KX=111320*Math.cos(35.37*Math.PI/180), KY=110574;
function loadGraph(){

  R.loading=fetch('route/graph.json').then(r=>{if(!r.ok)throw new Error('graph');return r.json()}).then(g=>{

    const comp=new Int32Array(n).fill(-1);let bestC=-1,bestN=0,c=0;
    for(let s=0;s<n;s++){if(comp[s]>=0||!adj[s].length)continue;let size=0;const st=[s];comp[s]=c;while(st.length){const u=st.pop();size++;const A=adj[u];for(let k=0;k<A.length;k+=3){const v=A[k];if(comp[v]<0){comp[v]=c;st.push(v)}}}if(size>bestN){bestN=size;bestC=c}c++}

function nearestNode(lat,lng){

async function runRoute(quiet){

  try{await loadGraph()}catch(e){showRouteBar('Could not load the street data. Use Open in Google Maps instead.',true);return}
  const a=nearestNode(R.from.lat,R.from.lng), b=nearestNode(R.to.lat,R.to.lng);
  if(a.i<0||b.i<0||a.d>400||b.d>400){showRouteBar('That point is off the map area. Pick a start nearer the town.',true);return}
  const path=astarG(a.i,b.i);

  const G2=R.graph; let d=a.d+b.d;
  for(let k=1;k<path.length;k++){const u=path[k-1],v=path[k];d+=Math.hypot((G2.la[u]-G2.la[v])*KY,(G2.ln[u]-G2.ln[v])*KX)}

}

function mergeOSM(list){
  let added=0;
  for(const o of list){
    if(!o||!o.n) continue;
    const f1=fold(o.n), f2=fold(o.alt);
    const dup=PLACES.find(p=>{
      if(metres(p,o)>60) return false;
      const fp=fold(p.n); if(!fp) return false;
      return fp===f1||fp===f2||(f1&&(fp.includes(f1)||f1.includes(fp)))||(f2&&(fp.includes(f2)||f2.includes(fp)))||(fp.split(' ')[0]&&fp.split(' ')[0].length>3&&(fp.split(' ')[0]===f1.split(' ')[0]||fp.split(' ')[0]===f2.split(' ')[0]));
    });
    if(dup){ if(!dup.oh&&o.oh) dup.oh=o.oh; if(!dup.web&&o.web) dup.web=o.web; continue }
    if(PLACES.some(p=>p.id===o.id)) continue;
    PLACES.push(o); added++;
  }
  return added;
}

async function loadOSM(){
  let cached=null; try{cached=JSON.parse(localStorage.getItem(OSM_KEY)||'null')}catch(e){}
  if(cached&&cached.items){const n=mergeOSM(cached.items);renderAll();if(Date.now()-cached.at<86400000){return}}
  for(const u of OSM_URLS){
    try{
      const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),30000);
      const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(OSM_Q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});
      clearTimeout(tm); if(!r.ok) continue;
      const j=await r.json(); const items=(j.elements||[]).map(osmToPlace).filter(Boolean);
      if(!items.length) continue;
      try{localStorage.setItem(OSM_KEY,JSON.stringify({at:Date.now(),items}))}catch(e){}
      const n=mergeOSM(items); renderAll();
      if(n) toast('Added '+n+' new places from OpenStreetMap');
      return;
    }catch(e){}
  }
  if(!cached) toast('Could not load the extra places. Check your signal and reopen the page.');
}

// ---------- live GPS ----------
const G={pos:null,acc:0,watch:null,follow:true,track:[],marker:null,circle:null,trackLayer:L.layerGroup().addTo(map)};
try{G.track=JSON.parse(localStorage.getItem('rethymno-track')||'[]')}catch(e){G.track=[]}
function todaysTrack(){const d=new Date().toDateString();return G.track.filter(p=>new Date(p.t).toDateString()===d)}
function drawTrack(){G.trackLayer.clearLayers();const tt=todaysTrack();if(tt.length>1)L.polyline(tt.map(p=>[p.lat,p.lng]),{color:'#B8246A',weight:4,opacity:.7}).addTo(G.trackLayer)}
function startGPS(){
  if(!navigator.geolocation){toast('This browser cannot share location.');return}
  if(G.watch!==null) return;
  G.watch=navigator.geolocation.watchPosition(onPos,err=>{
    navigator.geolocation.clearWatch(G.watch);G.watch=null;$('gpsBtn').classList.remove('on','follow');
    toast(err.code===1?'Location is switched off for this page. Allow it in your browser settings, then tap ◎.':'Still looking for GPS. Tap ◎ to try again.');
  },{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
}
function onPos(p){
  const ll={lat:p.coords.latitude,lng:p.coords.longitude}, first=!G.pos; G.pos=ll; G.acc=p.coords.accuracy;
  if(!G.marker){G.marker=L.marker([ll.lat,ll.lng],{icon:L.divIcon({className:'youdot live',html:'<u class="cone" id="cone"></u><i></i>',iconSize:[24,24]}),interactive:false,keyboard:false,zIndexOffset:3000}).addTo(map);G.circle=L.circle([ll.lat,ll.lng],{radius:G.acc,color:'#0E8FC7',weight:1,fillOpacity:.08,interactive:false}).addTo(map)}
  else{G.marker.setLatLng([ll.lat,ll.lng]);G.circle.setLatLng([ll.lat,ll.lng]).setRadius(G.acc)}
  const last=G.track[G.track.length-1];
  if(G.acc<50&&(!last||metres(last,ll)>12)){G.track.push({lat:+ll.lat.toFixed(6),lng:+ll.lng.toFixed(6),t:Date.now()});if(G.track.length>6000)G.track.splice(0,G.track.length-6000);try{localStorage.setItem('rethymno-track',JSON.stringify(G.track))}catch(e){};drawTrack();if(S.tab==='trail')renderTrail()}
  if(C.h!=null) setHeading(C.h); else if(p.coords.heading!=null&&!isNaN(p.coords.heading)&&p.coords.speed>0.5) setHeading(p.coords.heading);
  $('gpsBtn').classList.add('on');$('gpsBtn').classList.toggle('follow',G.follow);
  if(G.follow&&BOUNDS.pad(0.2).contains([ll.lat,ll.lng])) map.panTo([ll.lat,ll.lng],{animate:!first});
  if(first&&!BOUNDS.pad(0.2).contains([ll.lat,ll.lng])) toast("You're outside the old town map area right now.");
  if(R.to&&R.from&&R.from.live&&(!R.lastRouteAt||metres(R.lastRouteAt,ll)>15)){R.from={lat:ll.lat,lng:ll.lng,name:'your location',live:true};runRoute(true)}
  if(first) renderAll(); else if(S.sel) renderSheet();
  const hp=$('herePill');hp.hidden=false;$('hereTxt').textContent='Live location on'+(G.acc>40?' (weak signal, ±'+Math.round(G.acc)+' m)':'');
}
$('homeBtn').onclick=()=>{const h=byId('hotel');if(h){S.sel=null;startRoute(h)}};
$('gpsBtn').onclick=()=>{
  enableCompass();
  if(G.watch===null){G.follow=true;startGPS();return}
  G.follow=true;$('gpsBtn').classList.add('follow');
  if(G.pos) map.setView([G.pos.lat,G.pos.lng],Math.max(map.getZoom(),18));
};
// ---------- compass: which way you're facing ----------
const C={h:null,on:false,last:0};
function setHeading(h){
  if(h==null||isNaN(h))return; C.h=(h+360)%360;
  const now=performance.now(); if(now-C.last<60)return; C.last=now;
  const el=document.getElementById('cone'); if(el){el.classList.add('on');el.style.transform='rotate('+C.h.toFixed(0)+'deg)'}
}
function onOrient(e){
  if(typeof e.webkitCompassHeading==='number') setHeading(e.webkitCompassHeading);
  else if(e.absolute&&typeof e.alpha==='number') setHeading(360-e.alpha);
}
function enableCompass(){
  if(C.on)return;
  const go=()=>{C.on=true;window.addEventListener('deviceorientationabsolute',onOrient,true);window.addEventListener('deviceorientation',onOrient,true)};
  if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted')go();else toast('Compass is blocked. Allow motion access to see which way you face.')}).catch(()=>{});
  } else if(window.DeviceOrientationEvent) go();
}
if(!(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')) enableCompass();
document.addEventListener('click',function once(){enableCompass();document.removeEventListener('click',once,true)},true);
map.on('dragstart',()=>{if(G.follow){G.follow=false;$('gpsBtn').classList.remove('follow')}});

$('sheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-a],[data-s]'); if(!b)return;
  if(b.dataset.s!==undefined&&S.draft){S.draft.name=$('draftName').value;S.draft.checkin=$('draftHere').checked;S.draft.status=b.dataset.s;renderSheet();return}
  const a=b.dataset.a, p=S.sel&&byId(S.sel);
  if(a==='close'){S.sel=null;renderAll()}
  else if(a==='cancel'){S.draft=null;renderAll()}
  else if(a==='savedraft'){
    const d=S.draft, name=$('draftName').value.trim()||'My pin', ci=$('draftHere').checked;
    const id='c'+Date.now().toString(36), lat=+d.lat.toFixed(6), lng=+d.lng.toFixed(6);

    setPin(id,{custom:true,name,lat,lng,status:d.status,note:''});
    S.sel=id;
    if(ci) checkIn({id,n:name,lat,lng});
    renderAll(); toast('Pin saved');
  }
  else if(a==='route'&&p) startRoute(p);
  else if(a==='want'&&p) setPin(p.id,{status:status(p.id)==='want'?'':'want'});
  else if(a==='been'&&p) setPin(p.id,{status:status(p.id)==='been'?'':'been'});
  else if(a==='checkin'&&p) checkIn(p);
  else if(a==='rmpin'&&p){if(rmArmed){rmArmed=false;removePin(p.id);toast('Pin removed')}else{rmArmed=true;renderSheet();setTimeout(()=>{rmArmed=false},4000)}}
});

function renderList(){
  const q=(listQ||'').trim().toLowerCase(); const ps=allPlaces().filter(p=>!q||(p.n+' '+(p.alt||'')+' '+(p.t||'')+' '+CAT[p.c]).toLowerCase().includes(q)), h=here();
  const groups=[['want','Want to go',ps.filter(p=>status(p.id)==='want')],['been','Been',ps.filter(p=>status(p.id)==='been')],['sight','Sights',ps.filter(p=>p.c==='sight')],['food','Restaurants',ps.filter(p=>p.c==='food')],['drink','Cafés & bars',ps.filter(p=>p.c==='drink')],['misc','Shops & services',ps.filter(p=>p.c==='misc')],['custom','My pins',ps.filter(p=>p.c==='custom')]];
  let html='';
  for(const [g,title,items] of groups){
    if(!items.length&&g==='custom')continue;
    if(!items.length&&(q||g==='misc'))continue;
    if(!items.length){html+=`<div class="group"><h3>${title}</h3><p class="empty">${g==='want'?'Nothing saved yet. Open any place and tap Want to go.':'Tap I\'m here or Been on a place and it lands here.'}</p></div>`;continue}
    if(h) items.sort((a,b)=>metres(h,a)-metres(h,b));
    html+=`<div class="group"><h3>${title}<span>${items.length}</span></h3>`+items.map(p=>{
      const st=status(p.id), hi=hoursInfo(p), note=(S.pins[p.id]||{}).note;
      const sub=[CAT[p.c], p.r?'★ '+p.r:'', hi&&hi.state!=='open'?({shut:'closed now','closed-today':'closed today'}[hi.state]):'', note?'“'+note+'”':''].filter(Boolean).join(' · ');
      return `<button class="row" data-go="${esc(p.id)}"><span class="dot ${st}" style="background:${rateCol(p)}"></span><span class="nm"><strong>${esc(p.n)}</strong><small>${esc(sub)}</small></span><span class="d">${distTxt(p,true)}</span></button>`}).join('')+'</div>';
  }
  html+=`<p class="foot">Ratings and opening hours from Google, pulled 27/09/2026; check before you walk over. Map and extra places © OpenStreetMap contributors.</p>`;
  $('listBody').innerHTML=html;
}

function runMapSearch(){
  const q=$('mapSearch').value.trim().toLowerCase(), box=$('mapRes');
  if(q.length<2){box.hidden=true;box.innerHTML='';return}
  const h=here();
  let res=allPlaces().filter(p=>(p.n+' '+(p.alt||'')+' '+(p.t||'')+' '+CAT[p.c]).toLowerCase().includes(q));
  res.sort((a,b)=>{const an=a.n.toLowerCase().startsWith(q)?0:1,bn=b.n.toLowerCase().startsWith(q)?0:1;if(an!==bn)return an-bn;return h?metres(h,a)-metres(h,b):(b.rc||0)-(a.rc||0)});
  res=res.slice(0,12);
  box.innerHTML=res.length?res.map(p=>`<button data-go="${esc(p.id)}"><span class="dot" style="background:${rateCol(p)}"></span><span style="flex:1;min-width:0">${esc(p.n)}<small>${esc([p.t||CAT[p.c],p.r&&p.rc>=5?'★ '+p.r:'',distTxt(p,true)].filter(Boolean).join(' · '))}</small></span></button>`).join(''):'<div style="padding:12px;color:var(--ink-2)">No match. Try another spelling.</div>';
  box.hidden=false;
}

// trail
let armedVisit=null;
function gpsSummary(){
  if(typeof G==='undefined') return '';
  const tt=todaysTrack(); let d=0; for(let i=1;i<tt.length;i++) d+=metres(tt[i-1],tt[i]);
  if(!tt.length) return `<div class="group"><h3>Walked today</h3><p class="empty">Tap ◎ on the map and your walk is traced automatically while this page is open.</p></div>`;
  return `<div class="group"><h3>Walked today<span>${(d/1000).toFixed(2)} km by GPS</span></h3><p class="empty">Your route is the pink line on the map. It records while this page is open on your screen.</p><button class="linkbtn" data-cleartrack="1">${clearArmed?'Tap again to clear today\'s track':'Clear today\'s track'}</button></div>`;
}
let clearArmed=false;
function renderTrail(){
  const gs=gpsSummary();
  if(!S.visits.length){$('trail').innerHTML=gs+`<div class="group"><h3>My check ins</h3><p class="empty">Each time you tap <strong>I'm here</strong> on a place, it's logged here with the time, and today's stops are joined up on the map.</p></div>`;return}
  const days={};
  S.visits.forEach(v=>{const k=new Date(v.at).toDateString();(days[k]=days[k]||[]).push(v)});
  const keys=Object.keys(days).sort((a,b)=>new Date(b)-new Date(a));
  $('trail').innerHTML=gs+keys.map(k=>{
    const vs=days[k]; let dist=0; for(let i=1;i<vs.length;i++) dist+=metres(vs[i-1],vs[i]);
    const label=new Date(vs[0].at).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
    return `<div class="group"><h3>${label}<span>${vs.length} stop${vs.length>1?'s':''}${dist?' · '+(dist/1000).toFixed(1)+' km point to point':''}</span></h3>`+
      vs.map((v,i)=>`<div class="visit"><span class="num">${i+1}</span><time>${new Date(v.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</time><span class="n" data-go="${esc(v.placeId)}">${esc(v.name)}</span><button class="rm ${armedVisit===v.id?'confirm':''}" data-rm="${esc(v.id)}">${armedVisit===v.id?'Remove?':'×'}</button></div>`).join('')+'</div>';
  }).join('');
}
$('trail').addEventListener('click',e=>{
  const ct=e.target.closest('[data-cleartrack]');
  if(ct){if(clearArmed){clearArmed=false;const d=new Date().toDateString();G.track=G.track.filter(p=>new Date(p.t).toDateString()!==d);try{localStorage.setItem('rethymno-track',JSON.stringify(G.track))}catch(_){};drawTrack();renderTrail()}else{clearArmed=true;renderTrail();setTimeout(()=>{clearArmed=false;renderTrail()},4000)}return}
  const r=e.target.closest('[data-rm]');
  if(r){const id=r.dataset.rm;if(armedVisit===id){armedVisit=null;removeVisit(id)}else{armedVisit=id;renderTrail();setTimeout(()=>{if(armedVisit===id){armedVisit=null;renderTrail()}},4000)}return}
  const g=e.target.closest('[data-go]'); if(g&&byId(g.dataset.go)) select(g.dataset.go,true);
});

function setTab(t){
  S.tab=t;
  ['map','list','trail'].forEach(x=>{$('tab-'+x).setAttribute('aria-selected',x===t);$(x+'View').hidden=x!==t});
  if(t==='map') setTimeout(()=>map.invalidateSize(),0);
}

{const DESC={"ChIJI_c6WwB1mxQRJh7Q5UsopJA":"Old town taverna in a gorgeous old building with a high ceiling. Reviewers rave about the stifado, sea bass and the owner's warm welcome and recommendations.","ChIJWSF6qKB1mxQRAMx2ow_axCs":"Central restaurant with a nice view, generous platters and plenty of gluten free options. Check the bill, as bread and sauces get added, and some found service cold.","ChIJ-Xv7Tsx1mxQREpSyYNMC89E":"Seafront cocktail bar with a lovely sea view, great at sunset. Praised for creative cocktails, smooth coffee, friendly staff and fair prices for the front.","ChIJZRcqy6d1mxQR2iVAbjgPY6A":"Popular breakfast and brunch café loved by locals. Try the avo waffle, pancakes or oven croissant; staff are lovely, though it sits by a busy road.","ChIJQ14M96B1mxQRUoPC-g6mVso":"Seaside taverna at the end of the old town with a great atmosphere. Known for its octopus, fresh catch of the day and hearty meze; portions are big.","ChIJ42y7XwB1mxQRloSbxqClK-I":"The colourful umbrella street from the photos, though reviewers say only a small patch of umbrellas remains now. Still an atmospheric stroll.","ChIJY2lL5qB1mxQR_6zuXD_TBnQ":"Rethymno's only Roman Catholic church, built in 1897 near the Fortezza. A lovely building, with Mass on Saturday evenings and Sunday mornings.","ChIJTbaNLoB1mxQRD_pPE7_TiQc":"Tiny traditional workshop where filo is still made by hand. Watch the process and try what many call the best baklava of their lives; no big sign outside.","ChIJl8vY1bB1mxQRlWRCTXiCqs0":"Homemade ice cream that many call the best in town, very creamy with lots of flavours to sample. Scoops are huge and seating is tight on the pavement.","ChIJs0dP4g11mxQRnUOq4Gh8vTQ":"Cheerful dessert spot for ice cream, bubble waffles and crêpes at good prices. The staff's energy wins people over, and the layered sundaes are a treat.","ChIJm1BxvKB1mxQRZPtyiB0Dd0M":"Busy Italian spot serving pizza and pasta from breakfast to late. Most enjoy the food, though one reviewer found a member of staff rude.","ChIJR4SX3qB1mxQRhZ936ZqtAgw":"Old town restaurant with a lovely courtyard; book there rather than the street side. Praised for apaki, lamb chops, warm service and fair prices.","ChIJYd6lH5l1mxQRLsZTYRRXecE":"Asian restaurant for a break from Greek food, with fresh seafood, rich ramen and attentive service. Some found it a little pricey for what you get.","ChIJjVYqcqR1mxQRRETpfhyqOk4":"Taverna near the Fortezza with superb elevated sea and fortress views, lovely at night. Food is decent and fairly priced, with generous portions.","ChIJO0Vl2aB1mxQRzJ9b_TKR4_c":"Fine dining in a 16th century Venetian building with a flowering courtyard. Reviewers love the tasting menu with wine and olive oil pairings; ideal for occasions.","ChIJe99Izmh1mxQR99SvSDuE66M":"Busy waterside taverna with fresh seafood, moussaka and lots of gluten free options. Friendly service and free treats, though some portions felt small for the price.","ChIJZUF73c11mxQRmiB2q8SfKys":"Puzzle game with a locked backpack that leads you round the old town's alleys and landmarks. Great fun for a few hours; bring a pen.","ChIJcdiPedN1mxQRHhcmmN2rSdM":"Cute little family café hidden in the old town. Good for smoothies, freddo cappuccino and quick bites, with really friendly owners.","ChIJeZVj26B1mxQRKl4dxDEz-9Q":"Crêperie with sweet and savoury crêpes at low prices and cheerful service. Be warned the portions are enormous; one is often enough for two.","ChIJlWnJmHl1mxQRCS0zj1l5Kf0":"Beautifully restored old town gallery full of work by local artists, with pieces from around 10 euros. The owner and staff are warm and knowledgeable.","ChIJf5LryqB1mxQR7TxdG_SisZk":"Small, cosy family kitchen run by mother and son, with no menu; they explain the dishes of the day. Homely food, great for vegetarians too.","ChIJ3XwBlqB1mxQRlP2n-brtDXs":"Tucked away taverna with a lovely terrace and generous portions. Reviewers praise the moussaka, grilled shrimps and stifado, plus a free dessert.","ChIJ0VG2xqB1mxQRotDfYXj1Avo":"Long established family taverna on a quiet old town lane, away from the noise. Homemade food at fair prices; the lamb and baklava are recommended.","ChIJcfhg8md1mxQRwl1oIMeA1vM":"New cocktail bar in town with great drinks, good music and a relaxed vibe. There's finger food too, and a photo booth inside.","ChIJMUHQ96B1mxQR_NoQzSVLpBA":"Seafront terrace with a lovely sunset view and fresh fish. Most enjoy it, but one diner found it overpriced, slow and poor, with only the setting worth it.","ChIJMSnKNKZ1mxQR3rMMxhBxKq4":"Takeaway spot for superb Macedonian bougatsa, sweet with custard or savoury, plus pies and coffee. Friendly and well priced, though by a noisy road.","ChIJSbdQGqd1mxQRxCq6_mDXAG4":"Charming old town restaurant with tables outside under vines and art, great for people watching. Fresh, tasty food, friendly staff and often a free dessert.","ChIJgXxyGxZ1mxQRSHXSLhgVaUU":"Hotel restaurant praised for spotless tables and very attentive staff. Reviewers recommend the arancini, prawn saganaki and seafood linguine, with good wines.","ChIJxY6BWu11mxQRDoVzxhwSzLw":"Colourful café beside the Fortezza with a great view over town and a relaxed feel. Nice for drinks and snacks, though one visitor found service very slow.","ChIJdQJKsKB1mxQRGPREBnFMEzM":"Speciality coffee shop with single origins, cold brew, flat whites and good bakes. Comfy and cool with air con; kid friendly, though smiles can be scarce.","ChIJMTOpQVN1mxQRntYiEGTTWrY":"Little bistro café serving breakfast through to evening. Loved for warm cookies, pinsa and small plates, and a nice spot for a glass of wine.","ChIJW7jhPgB1mxQRjCPqMJMg0Pc":"Tiny family spot on an old town backstreet with just a few tables. Friendly host, free snacks and great gyro platters; food is made fresh so can take a while.","ChIJ0QgGTu91mxQRcr1MJODo1GA":"Pretty café with a lovely outdoor area and gorgeous interior. Reviewers rave about the freddo and carefully made coffee, with alternative milks and fair prices.","ChIJJzKz3WV1mxQRdWKy83x5HDw":"Hidden coffee shop on a narrow street with a cool vibe. Praised for excellent coffee, including one of the best flat whites on Crete, and tempting pastries.","ChIJK9Qaw1l1mxQR1b-hXP3sjMU":"Cosy family café just away from the tourist crowds. Known for a great freddo cappuccino, homemade sweet treats and a very warm welcome.","ChIJyRl59qB1mxQRrsTZm91JCqY":"Café in a hotel lobby, so there's no sign outside. A nice view, very caring service, good ice cream and coffee with almond milk available.","ChIJd7a8aPx1mxQRW4_uVVFgKWU":"Authentic kafeneio where locals come to chat over beer and ouzo. Skip the menu and ask for simple plates like sardines, olives and cheese; generous gyros too.","ChIJDTquUwB1mxQRaR103_vEGmo":"A true traditional kafeneio in the heart of the old town, family run and serving coffee the local way.","ChIJTbYXSQ51mxQR90iIZP8RyQ8":"Hugely popular brunch café with great coffee and generous plates. Try the Japanese pancakes, acai bowls or pasta; lots of veggie and vegan choice and good value.","ChIJReYwyr51mxQRegQxba9A-3A":"Bakery with a huge range of pastries, fancy desserts and fresh spanakopita, handy for a beach breakfast. Most find staff friendly, but one found them curt.","ChIJ-eTGBcB1mxQREzsNkAOcfPg":"Small local park with a football pitch. Reviews are few and not very positive, mentioning litter and a rude encounter.","ChIJz8umm3B1mxQRcfIM-I1LhjE":"Friendly restaurant away from the seafront with excellent value. Guests return night after night, and one Belgian chef called the mussels the best ever.","ChIJh7VhxRR1mxQRgofgu7FpouI":"Very popular restaurant with views of the old town, beach and promenade. Fast, friendly service; the lamb kleftiko and halloumi get praise. Book ahead.","ChIJp9K8DwB1mxQRVhnT6qDVm_E":"Dog friendly café with good coffee, oat milk and cinnamon rolls. Most love it, but some got served in takeaway boxes and one found staff rude.","ChIJWUDkEBJ1mxQRHlY9o1QBrTk":"Small café bar with a view over the bay, run by a lovely owner. Great cocktails at good prices, and the gyros is outstanding.","ChIJpcsJut91mxQR1AJH0E2WBf8":"Easy to miss cocktail bar with delicious, fairly priced drinks served with free snacks and water. Very warm staff; try the Zombie or a smoothie.","ChIJk96AvPF1mxQR4_-r2LZNLoM":"Friendly little café opposite a big playground, with parking outside. Home cooked dishes like the chicken and feta penne, and very helpful service.","ChIJI_SaWH11mxQRTKpCb5-_wYk":"Hotel restaurant with a passionate chef, including sushi, and excellent service. Reviewers praise the smash burger and fries, octopus and inventive cocktails.","ChIJsztWVgB1mxQRBe8pfyM-YFg":"New halal Syrian spot with big, tasty shawarma, hummus and kebbe and very friendly service. One diner reported a hair in their food.","ChIJH5km6A11mxQRKG8N2Jr01u0":"Long, wide town beach with soft sand and calm, shallow water. Sunbeds and umbrellas cost about 10 euros, with changing rooms and showers along the promenade.","ChIJOQVUmxF1mxQRGnLDyIbflTc":"Family bakery and café with indoor and outdoor seats, good cakes and coffee at fair prices. The strawberry tart is a favourite; staff are friendly.","ChIJ5fbObbd1mxQRyb-_DxeMbg8":"Friendly taverna with sea and sunset views, famous for its tender spare ribs. Great for coeliacs with a separate fryer; lamb kleftiko and moussaka also praised.","ChIJHx1KjDh1mxQRNDnHhq6P71c":"Family taverna where grandma cooks traditional food with love. Loved for lamb or pork in white wine, handcut chips, great value and free dessert and liqueur.","ChIJ_4hjHON1mxQRTLpOS36MbQI":"Calm beach bar with just three rows of sunbeds and no music. Beds are free if you spend 25 euros per pair; good coffee, gyros and very kind staff.","ChIJcbHEgkB1mxQRNCnNFVBm1yg":"Friendly sea view restaurant with generous portions; the fried seafood plate easily feeds two. Try the shrimp saganaki, and beach chairs are free with drinks.","ChIJ4V3m8sp1mxQRkUtfM3TFpYY":"Handy drive through café for a quick coffee with good prices and friendly staff. The waffle on a stick is a standout.","ChIJ4cR6NKd1mxQRFGp8NCX_y3o":"Family run taverna in the Old Town with a lovely flower filled garden. Fresh Cretan cooking, a great grill plate and free raki to finish.","ChIJv-vvSH11mxQR96dUXnVPfvY":"Friendly cocktail bar with good music and free snacks. Reviewers love the passion fruit spritz and whiskey sour, and it stays shaded and cool.","ChIJzcuvqKB1mxQRrvhiFBDuvKA":"Modern harbourside bar with sea views, cocktails and shisha. Great value food with vegan options; try the bao bun tacos or dirty chicken bowl.","ChIJo7bJx6B1mxQRCvcjsJ56zZw":"Tiny Old Town espresso bar with a friendly barista and superb cappuccino. Coffee comes with free water and biscuits, and prices are low.","ChIJm77iqhV1mxQRseYp5j-zWgM":"Much loved family taverna run by the warm owner Maria, with balcony views and fresh seafood. It is usually fully booked, so reserve ahead.","ChIJwT_UFwB1mxQRiOj9ENU9fQw":"A short flight of painted blue steps in the Old Town. Nice for a quick photo as you pass, though a bit faded and not worth a special trip.","ChIJzcrEQad1mxQRNLvfDWffats":"Domed church of St Barbara, patron saint of Rethymno, built in 1885 in the heart of the Old Town. Look out for its frescoes and old icons.","ChIJ9TPqF6d1mxQRJ5klJ2Xvcr0":"Old Town bakery with sweet and savoury bakes, good coffee and hearty breakfasts. The chocolate baklava is a hit, though some pastries can be dry.","ChIJeYZSgRB1mxQREFH3y79SXCk":"Ice cream shop that reviewers call the best in town, with rich texture and a huge choice of flavours. They also sell homemade chocolate pie.","ChIJU0tzxqB1mxQRS86AAZaw3wM":"Old Town snack bar going for decades, known for homemade Greek cheeseburgers with herbs and spices. Great value, but it only takes cash.","ChIJscQttqB1mxQRacd0Gp4MBcQ":"Old Town restaurant with a pretty courtyard, polished service and a good wine list. Try the fish in salt crust; free raki and dessert follow.","ChIJe5jdzgl1mxQRNLSBB_k8oPE":"Homely restaurant with no fixed menu, just the day's home cooking at low prices. The snails are famous; free watermelon and raki to finish.","ChIJUdygqO91mxQRfCy3_8_C3TM":"Seaside Mexican spot with lovely views, cocktails and slow cooked tacos and fajitas. Most rave about it, though one reviewer found the food average.","ChIJyTb92Id1mxQRqF45wtLV4y8":"Small, cool coffee shop with very kind staff, tasty snacks and a nice view of the narrow streets for people watching.","ChIJNW3VQQl1mxQRwiyQw7w1rJ4":"Traditional Greek food in generous portions at fair prices, with warm staff and little free gifts. Unassuming from outside but well worth it.","ChIJe-VniaB1mxQRXqaFnDG0GsM":"Long running cocktail bar popular with locals, with a DJ inside and friendly service. The Pornstar Martini gets praise; quieter early evening.","ChIJxaDONV11mxQR6_q0oftuH6A":"Colourful Latin cocktail bar in the Old Town with great music. Try the pina fumado and the burger, but the outside chairs are not comfy.","ChIJnZ_hsit1mxQRfZttKZANe2M":"Old Town Irish pub with a huge beer choice and free crisps that keep coming. Good for people watching, though a pint of Guinness is pricey.","ChIJwTJzLAB1mxQRuZnEUKJ6_4Y":"Cosy cocktail bar with creative, unusual drinks and great music. Most reviewers love it, though one found their margarita weak and poor value.","ChIJKyAXk711mxQRNG_bvqBWsvU":"Restaurant by the fortress with sunset views and friendly staff. Praised for the seafood platter, sea bass and dakos, with free starters and dessert.","ChIJV2AwieZ1mxQRE8CnKnCbR6g":"Charming wine bar on a lovely street with knowledgeable staff and fair prices. The wine tasting is a highlight, with small bites to pair.","ChIJYfUX-wl1mxQR1CtF3AKXenY":"Seaside Greek taverna with friendly, family friendly service and generous portions. Reviewers single out the tzatziki and vine leaves.","ChIJz4A59Al1mxQR8Sli2N98wRY":"Sandy town beach right by the centre, good for sunbathing. The stretch near the Old Town and lighthouse is quieter, with great views of the city.","ChIJC_7VtEl1mxQRWf8b2BaMD8M":"Central cafe with breakfast buffet and cheap snacks, but reviews warn of uneven quality and one reports tourists being overcharged for coffee.","ChIJs5hc0qZ1mxQRVVFbcuQ4U0g":"Authentic, cheap Old Town taverna with homemade Cretan food, great raki and live traditional Greek music on some nights. Try the saganaki.","ChIJOcuDMJF1mxQR9CCiQuaEIo8":"Small bakery run by a friendly owner from Thessaloniki, known for the best bougatsa in Crete. Cream, meat and spinach pies all get top marks.","ChIJwbGqqB11mxQR1pwIgsfq2nk":"Outstanding restaurant with fresh meze, daily specials and friendly staff. Reviewers rave about the kebab, garlic bread and free orange cake.","ChIJ607H66B1mxQRcx8ATX_DK4I":"Well located restaurant with a big menu and welcoming service. Lamb shank and kleftiko are praised, but some find it pricey and a few dishes dry.","ChIJ0c0nwAN1mxQRo8iWCnX_sis":"Friendly family cafe for iced Greek coffee and fresh breakfasts. The homemade spinach pie is baked each morning, and there is good local beer.","ChIJIwm_P8p1mxQRRutSkYSm0rw":"Peaceful rooftop cafe bar above the Old Town with lovely views. Well made coffee, good breakfasts and cocktails; the roof opens when there is space.","ChIJC7MVfwB1mxQRZyT7EqpdzE8":"Seaside cafe with good food and music; the pistachio French toast stands out. One review warns of unfriendly service and missing menu items.","ChIJQw7N25x1mxQRi25njLhkzBo":"Pretty Cretan restaurant with mostly glowing reviews for the food and attentive staff, though some found it average and were charged for bread.","ChIJrdAWwOx1mxQRfwpn6NDw8bo":"Cosy deli cafe on a quiet street with great coffee, fair prices and a fig cream pastry worth trying. Food can be very slow at busy times.","ChIJAdz6vqB1mxQRRh5lFhbIeFA":"Quirky cafe bar tucked away in the Old Town alleys, with original decor, good music and warm owners. A nice stop for a drink and photos.","ChIJJXFQF6d1mxQRq0Zp_6C5GzQ":"Small cafe with fresh baked goods and good coffee. Reviewers enjoyed the custard and mushroom pastries, plus ice cream made with sheep's milk.","ChIJn7uQ6sx1mxQRmgN1QkuTWS8":"Relaxed cafe with smooth iced coffee that some call the best in town, plus plenty of breakfast choices and quick, friendly service.","ChIJpaC3CQB1mxQRGPrXKOEVQnE":"Friendly coffee shop with a wide menu, great freddo cappuccino and goat milk ice cream. Staff were unsure on allergens, so check carefully.","ChIJp48-lad1mxQRjH9QO9JwET4":"Traditional kafeneio just outside the Old Town, loved by locals for quality raki and classic meze. Open from early morning until late.","ChIJ7fvDvBF1mxQRG9VrJrFHNW0":"Large, elegant restaurant and bar near the shops with some sea views. Good cocktails, a torpedo shrimp roll and fair prices for groups.","ChIJf1I1MB11mxQRiWRcfbuhXs4":"Busy bakery popular with locals for fresh pastries, baklava, pizza and good iced coffee at fair prices. It can get loud at peak times.","ChIJZaqbIwB1mxQRXmgn2XwZ5us":"Rethymno's Old Town, a lovely place to wander with Venetian buildings, narrow back streets, little shops and plenty of places to eat.","ChIJ76aCNel1mxQRX3ma-5jUu2A":"Warm family taverna just off the beach road with homemade dishes around 10 to 15 euros. Try the chicken with ginger and orange.","ChIJsaD2yyl1mxQRJUZZgonn7-Q":"Independent seafront patisserie with homemade cakes, ice cream and brunch. The cinnamon roll and eggs Benedict are favourites.","ChIJ62D_IQB1mxQRn5zx12YT9Eg":"Beach bar with lounger service, friendly staff and a wheelchair ramp. Praised for its Greek salad, but one review found the restaurant food poor.","ChIJ80RCPMx1mxQRZu-sh0xaDrc":"Brunch cafe with healthy options, generous salads and a great fried chicken sandwich. Attentive service, though it sits on a noisy main road.","ChIJdb-imzR1mxQRJF0uNSebETQ":"Arabic restaurant a few minutes from the beach serving authentic shawarma and platters. Big portions, friendly staff and affordable prices.","ChIJy5U4vZt1mxQRYkALhBRmgWg":"Small family pizzeria near the beach, cooking everything fresh in front of you. Great pizza and pasta; eat in or collect, as delivery is slow.","ChIJY-_kmQ51mxQRtRoD5QH-Krc":"Cosy snack bar run by a very welcoming couple, with sea views, tasty food and a lovely cheese toastie. Feels genuinely homely.","ChIJDZq0tRN1mxQRojrSkc0RJdU":"Frozen yoghurt shop with lots of toppings, good crepes, lovely staff and good value. One reviewer found the ice cream flavours disappointing.","ChIJJ3LyfxR1mxQRM1VlsXRE8-I":"Clean town beach with lovely sunsets and free sunbeds if you buy a drink. There are no lifeguards and waves can be strong, so take care.","ChIJjwnARSV1mxQRBUZsDSxtiyw":"Busy, cheerful self serve frozen yoghurt shop in the centre, paid by weight, with a big choice of fruit, sauces and toppings. Friendly staff.","ChIJPewA6Xh1mxQR8VDOF-dGUww":"Beach restaurant with free sunbeds and parking when you order, attentive staff and a varied menu. Loved for its slushies and mango feta salad.","ChIJM651qTh1mxQRqkAu2AWIFBw":"Welcoming taverna serving homecooked Cretan food in generous portions at decent prices. Great with children; the homemade baklava is a star.","ChIJ23vCNgB1mxQRUxRValKt7UA":"Friendly beach cocktail bar with cheap sun chairs, a very good Mai Tai and tasty club sandwiches and cheese toasties.","ChIJi-B11z11mxQR8A4p3p4_vEI":"Elegant seaside restaurant with panoramic views over the promenade, ideal for a romantic dinner. Most praise the food, though one had undercooked chicken.","ChIJfwfMfEd1mxQRD1KXwfK9dFk":"Small homely taverna with free raki and dessert. Many love it, but one review reports reheated food and tourists charged more than the menu price.","ChIJT1J95KZ1mxQRfVgO7wpI0bg":"Shady courtyard restaurant among lemon trees, a calm escape from the crowds. Reviewers love the pork belly souvlaki and the breakfasts; cocktails get mixed notes.","ChIJT75EK6d1mxQRiLwp4tfzLHE":"Stylish cocktail bar with quirky decor and a relaxed vibe. Reviewers rave about the signature cocktails and the warm, friendly team. Open from brunch till late.","ChIJZU91z6B1mxQRwW9txakhPzY":"Modern all day cafe with good people watching. Praised for varied, fairly priced breakfasts and brunch, good coffee and friendly staff, though service can be slow.","ChIJ1-HoN5J1mxQRW2bpkxRqU8E":"Small, friendly café loved for its iced coffee, fresh power bowls and pancakes. Big glasses of fresh orange juice at a good price.","ChIJDfANaR91mxQRR3dN6honV5Q":"Central street art wall worth a glance if you pass by. Reviewers say the best murals have been painted over, so not a must see.","ChIJ4bBNC6d1mxQRDshqDEw5qno":"Handsome church on a central square, a short walk from the old town. Free to enter, with lovely frescos and a painted dome. Cover shoulders and knees.","ChIJ2a9ok6V1mxQRqyDF9vWSX2A":"Pretty, well kept church with Greek religious art. Reviewers find it a peaceful spot for a quiet moment and a taste of local culture.","ChIJ2VrYMgh1mxQRp_rOuMlbtA0":"Busy local bakery with fresh Greek pies, doughnuts and very cheap coffee. Popular with locals, so expect a morning queue. Outdoor high tables.","ChIJ6e49R6d1mxQR4fS2bUdY-wc":"Much loved gelato shop with changing flavours and plenty of vegan, sugar free and gluten free choices. Try the pistachio or the Puro Nero dark chocolate.","ChIJ8aHhSJl1mxQRNL4Piaayt7U":"Modern take on Greek grill and gyros, full of locals. Reviewers rave about the truffle burger, house cut fries and black Angus pita. Great value.","ChIJT0-ImaB1mxQRCwa4Q9I_JpI":"Top rated seafood restaurant with Aegean decor and a lovely view. Praised for lobster, grilled octopus and shrimp saganaki, plus very warm hospitality. Pricey.","ChIJ-ex-zqB1mxQR73OIbtW8XxQ":"Family run restaurant with charming staff and a great gluten free reputation. Reviewers love the grilled jumbo prawns, tender calamari and panna cotta.","ChIJE1cLY3F1mxQRFd-dyzfWQ0k":"Traditional Cretan meze taverna with a warm, homely feel. Reviewers praise tasty food, generous portions and good prices. No tourist trap here.","ChIJ7R9gzaB1mxQRdALyPjaP-Qk":"Charming taverna with outdoor tables and raki included at the end. Fans love the dakos cheesecake and fried feta; the fried squid got mixed reviews.","ChIJKWmAwgl1mxQRWfQLGQxaUVM":"Tiny family run souvlaki spot, best for takeaway. Authentic gyros and pitas cooked fresh at bargain prices. Few tables, but fast, friendly service.","ChIJtyJ6qKB1mxQRL_9yhL2VNNc":"Stylish cocktail bar with comfy sofas, a nice view and good music. The signature cocktails shine, though prices are on the high side. Also does brunch.","ChIJQ6w1Bad1mxQRtzPgdlFfwIk":"Italian gelato by the Goura Gate with big portions and rare seating to rest. Cinnamon cookie flavour gets praise. May close before 11pm, despite the hours shown.","ChIJK7LddaR1mxQRy0SmmdDA1Fg":"Large globe monument on the seafront walk, a handy meeting point. Reviewers say it looks lovely lit by the sunset.","ChIJyVflRUl1mxQRt8Sk8CU1AoQ":"Friendly cocktail bar that guests return to night after night. Menu sorted by base spirit, excellent cocktails and some good beers too.","ChIJwSzq6-l1mxQRgQJtOOc66xE":"Little pizza and pasta place tucked away in the old town side streets. Reviewers call the thin, crispy wood fired pizza the best of their holiday. Good value.","ChIJeZ0zKYV1mxQRqLdBJq7xGSY":"Relaxed brunch café near the Thursday market with a huge menu and fair prices. Poached eggs, club sandwich and banana Nutella French toast get praise.","ChIJ-ZDjRaZ1mxQR0gC5PPg9yCw":"Shady garden café with a local feel, good coffee and a playground. Nice for cake and a rest, but smoking is allowed and breakfast choice is limited.","ChIJfXNJOQB1mxQR_MhG4NGRlB8":"The classic Rethymno sight: a pretty Venetian harbour with fish, fine buildings and lots of restaurants. Expect pushy touts; parking nearby is tricky.","ChIJlQJqBKR1mxQRhOSxdOcNNlA":"Popular, relaxed café for meze, gyros and drinks at fair prices. Big portions, quick kind service. Try the chicken gyros or the sheep milk ice cream.","ChIJA1e_7OV1mxQRGueDsRqpSEI":"Sweet little juice shop run by a lovely owner. Fresh, pure juice blends that reviewers call the best in town. Ask for his favourite.","ChIJvV6sgA51mxQRH1-58O4bt7A":"Picturesque café known for loukoumades, Greek honey doughnuts made fresh to order. One portion easily serves two. Good coffee and friendly service too.","ChIJc7kxvxN1mxQR21hlAzqBRZw":"Harbourside restaurant with a nice view. Recent diners enjoyed the grilled octopus and friendly staff, but the low overall rating suggests very mixed experiences.","ChIJa1u3dQB1mxQRvB-DY9NqIRo":"Highly rated restaurant with a warm welcome from the owner. Praised for homemade bread, grilled meats, seafood and even sushi. Can be slow when busy.","ChIJi-zGmKB1mxQRr3EAsCfFl5A":"Harbour café fine for a sundowner drink, but reviewers warn of tourist trap prices, pushy staff and food served cold. Best avoided for meals.","ChIJ2eVqVLJ1mxQRMk5BsWA0GQc":"Cosy garden bar with flowers and soft lighting. Reviewers love the characterful bartender, bespoke cocktails and happy hour from 5 to 9pm.","ChIJs4_bCgp1mxQRi68cFtWPWpc":"Harbourside cocktail bar with comfy seats and a lovely view. Reviewers praise beautifully balanced cocktails, good coffee and very friendly staff.","ChIJ-74ZJwB1mxQR-zdZ0r8p-AA":"Seafront restaurant with a sea view but a very poor rating. Reviewers warn of a tourist trap: pushy touts, frozen seafood, rude service and high prices.","ChIJKYByPQh1mxQRUnzoX1kDj-c":"All day café for breakfast and coffee with decent portions and prices. Reviews are mixed, with some reporting long waits and unfriendly service.","ChIJLaUAz6B1mxQR9PIjziZQo6Q":"Busy old town taverna with tasty meze and seafood, plus free loukoumades after. The fried zucchini is a favourite. Can be loud, and some mains disappoint.","ChIJ7Vm9TAh1mxQRQ8EZJ_ICGHM":"Friendly little bakery café for a slow breakfast. Reviewers love the cheese bougatsa, spinach pies and good coffee. Authentic and welcoming.","ChIJDxw9QM91mxQRwk1sJyLOGzE":"Modern, no fuss souvlaki and grill spot on the edge of the old town. Charcoal grilled meats, homemade pitta and huge wraps at good value. Arrive early.","ChIJt7ILiOV1mxQRFVt5MKskSN4":"Casual spot for crispy fried chicken, wings and fries, cooked to order. Reviewers call it the best in town, with friendly staff and low prices.","ChIJHy9bKRt1mxQRm871Na2Me-w":"Seaside Greek restaurant watching boats come into the port. Praised for seafood, souvlaki and grilled sea bass, generous portions and friendly, low pressure service.","ChIJ0ZvsJg51mxQRLPkhEz1Fsxc":"Local favourite for traditional gyros near the beach. Tender, tasty meat, seasoned pitta and halloumi, fair prices and quick service.","ChIJWZVUWgB1mxQRMoXLTra8mSE":"Viewpoint over Rethymno with its picturesque Venetian harbour, lighthouse and old town. The fortress above is worth a visit, admission is about 5 euros.","ChIJC3nPPwh1mxQRh3zAMkZ7PY8":"Pastry shop that reviewers call the best in town for cheesecake, tarts and pistachio ice cream. Mini versions let you try more. Little seating and a busy road.","ChIJb88Ekl91mxQRDxSB5rQXIB8":"Friendly restaurant by the beach with quick service and big portions at good prices. Gyros, chicken soup and made to order pizza get praise.","ChIJf5NUIgB1mxQR57aAI-QCYGY":"Café for ice cream, waffles and pancakes by a busy road. Some rate the ice cream best in town, but others report rude service and watery smoothies.","ChIJ6XY0OQB1mxQRhwMZsvqb_d4":"Stylish beach bar for a relaxed drink. Reviewers praise the cocktails, tasty burgers and nuggets, and fast, friendly service.","ChIJS90dYwB1mxQR65Addp51p7I":"Friendly spot across from the beach with sunbeds, coffee, food and cocktails. Try the club sandwich or a frozen green apple splash on a hot day.","ChIJyS-WGbV1mxQRUOv1OMUJZBw":"Pretty café with croissants in every flavour, cookies and ice cream at fair prices. The red velvet croissant and pistachio ice cream are favourites.","ChIJz5kckRF1mxQR8YhtXg0oRAc":"Casual Italian near the beach with a big terrace. Reviewers praise tasty pizza and pasta, generous portions, fair prices and fast, smiling service.","ChIJL5euaJV1mxQR1sPi1nR1Rns":"Cosy seaside café with free sunbeds when you eat. Reviewers love the homemade pinsa and focaccia, the huge club sandwich, good coffee and friendly staff.","ChIJ64tGBhJ1mxQRy2AglceyW_Q":"Popular Italian just outside the old town with a pizza oven and sunset views. Generous pizzas, pasta and grilled meats, with welcoming, unpushy staff.","ChIJBZTlNEl1mxQRh_HDcmJ4eCM":"Long town beach with clean, warm water, sunbed hire, bars and shops close by. Busy, pebbly in places, and front row loungers cost extra.","ChIJFZDgYRR1mxQR3Lb0o3Ic6T4":"Sports café with eleven screens and personal speakers, happy to show almost any game on request. Around 15 euros with two drinks included. Book ahead.","ChIJgyu_k3J1mxQRLqw7cp0Q_h8":"Sea view restaurant perfect for sunset. Reviewers rave about the warm welcome, free bread, raki and cake, and the jumbo prawns and cheese doughnuts.","ChIJK_haJ3F1mxQR5QMKFkEAMRU":"Traditional grill taverna using home produced meat, cheese and vegetables. Reviewers praise authentic grilled meats and starters at fair prices.","ChIJV-NO3fN1mxQRmv83FrMVwt0":"Beach bar with sunbeds and no minimum spend, good for morning coffee or a sunset cocktail. Tasty club sandwiches and bowls at low prices.","ChIJjyQQFBV1mxQRI1lBdUbTtxc":"Stylish seaside restaurant with spectacular sunsets. Reviewers love the creative dishes, sea bream, cocktails and homemade ice cream. Good value for the quality.","ChIJjW9Gvzh1mxQRE-L9B_a3BUY":"Charming, spacious taverna with fresh, authentic Greek food and huge portions. Try the gyros, shrimp pasta or fried calamari. A little pricier, but worth it.","ChIJHc5YG6F1mxQROtlfc0eU6Sk":"Friendly family taverna near the Fortezza with homemade dishes like stuffed vine leaves, spotless toilets and fair prices. Rinio and Giorgos are much loved.","ChIJDSF6qKB1mxQRCzUBIESw6S0":"Lively rock and metal bar with strong cocktails, a daily happy hour and live music some nights. Friendly staff, decent pub food and open late.","ChIJSXMzqqB1mxQRIdZhFd5MM64":"Beachfront cafe popular for brunch, with praline pancakes and omelettes at good value. Reviews are mixed, with some reporting poor food, service and rowdy nights.","ChIJK4LaK6F1mxQRFjJ7lrlHfng":"Traditional taverna loved for its stamna lamb, giouvetsi and moussaka, with warm service, fair prices and free baklava to finish.","ChIJV7iJOQB1mxQRGdpAN__BbsU":"A small lane of hanging umbrellas over cafe tables in the old town. Pretty for a photo, but reviewers say it takes seconds to walk through.","ChIJ6zkDM6F1mxQRAgGG1Gn4API":"Small historic church in the heart of the old town, praised for its peaceful feel, frescoes and beautifully painted woodwork.","ChIJy1A9B6d1mxQRMR-8n9LwWbE":"Much loved bakery with cheap sweet and savoury pastries; try the portokalopita or lichnarakia. Coffee is only average, and there's a park opposite.","ChIJ09a_yqd1mxQRYbilsP_Kdoc":"Busy, trendy bakery cafe with pastries, pies, grab and go salads and good iced coffee. Tables are hard to find and one reviewer got a rock hard eclair.","ChIJ34fIkAl1mxQR9i2GAcXobf0":"Popular ice cream parlour with big scoops and lots of flavours, such as pistachio and happy hippo. A bit pricey, and some found the desserts artificial.","ChIJj4XFQz91mxQRFa29-usVvc0":"Tiny smash burger joint with a big reputation; try the Prime with Golden BBQ sauce, crispy tenders or loaded fries. Passionate, friendly owners.","ChIJl6W01P91mxQR_Crwr7hZQFc":"Relaxed restaurant away from the busy streets, loved for its lamb kleftiko, fresh fish, stuffed fig leaves and garlic bread. Worth booking ahead.","ChIJ92lH9jp1mxQRwAu3YyAgQOg":"Stylish sea view restaurant serving both Greek and Asian food, with good sushi and cocktails. Waiter George gets plenty of praise.","ChIJez5NxaB1mxQRYd281rRQZ4Q":"Buzzy spot in the heart of the old town for a Greek plate, waffle dessert or creative cocktails like the espresso martini. Often packed, so seats are scarce.","ChIJv9WUTrB1mxQRqE-p86bR01k":"Meze restaurant opposite the harbour with beautiful fish and meat meze platters, friendly staff, raki and sometimes live music. A highlight for many.","ChIJW_hsGqd1mxQR51wYKbOvF6E":"Cheap and cheerful gyros grill in the old town with fast service and fair prices. Opinions vary on the meat, and orders can go astray when busy.","ChIJY44xTQh1mxQRysuVD_90qDk":"Arty, relaxed brunch cafe with generous portions, excellent single origin coffee, iced matcha and unusual crêpes. Friendly, patient staff.","ChIJp6Ixmst1mxQReFUvcsq6yX0":"Stylish cafe with book lined shelves, great coffee and tasty breakfasts, including good vegetarian options. One reviewer found the chicken sando dry.","ChIJI-X7JwB1mxQRUjMyTwknduI":"Peaceful seaside viewpoint on a coastal path with benches and steps down to the rocks. Lovely at sunset, though less appealing on a cloudy day.","ChIJs8Qw6PZ1mxQRNdxyNp6J-LQ":"Tiny, cosy cocktail bar in the old town serving creative spritzes such as Hello Peaches. Warm host Rafael and a spotless loo.","ChIJ3zrNVPF1mxQRkWmOiLEzbAI":"Well liked Italian open all year, with lots of pizzas and pasta; try the saffron risotto or the unusual Burger Pizza. Friendly, quick service.","ChIJY-Gap0N1mxQReHe9QxfseUo":"Artisan gelato made with real milk, with vegan and sheep milk options and big scoops for about €2.80. Try Bueno or Soft Nocciola.","ChIJqbQCWKB1mxQRBmrkQfYZqYw":"Seafront restaurant with a gorgeous sea view and cooling breeze; the grilled octopus and seafood get top marks. The best seaside tables go early.","ChIJo5EFrd51mxQRLoWzfvmFxx4":"Family run old town restaurant loved for its mixed seafood platter and sea bass, with warm hosts Daniel and family. Many diners go back more than once.","ChIJz0OuaCt1mxQR6pe-XMiAhQc":"Cretan cooking in a beautiful Venetian setting in the old town; try the stuffed calamari and marinated sardines. The owners are very welcoming.","ChIJM3oUknR1mxQRdT7hCBkf_Fw":"Tiny street counter serving focaccia sandwiches, pasta and spritzes from about €5. Run by a lovely couple and great value.","ChIJ79e3-Ol1mxQRq--kwh3X8UE":"Late night dessert spot for big crêpes and loukoumades with honey, sesame or ice cream. A favourite snack after a night out.","ChIJeYCQ66B1mxQRzRGa6YeFhG0":"Garden restaurant full of flowers and trees, serving upmarket Cretan food at fair prices with a great wine list. Good for group celebrations.","ChIJPzKAFqF1mxQRqoxe2OTldis":"Laid back cooperative cafe bar on a steep lane by the Fortezza, with local wine, food and Greek music. Openly political decor; one reviewer was refused service.","ChIJJzojzDd1mxQRyawhYS_Vcbs":"Small speciality coffee bar with superb barista coffee, artisan teas and cakes, plus Dodoni ice cream. Open until 10pm.","ChIJpSujnbt1mxQR1cG3mtVgLO4":"Hidden gem on a small old town square with simple, fresh, homemade tapas style dishes and Greek music. Mostly local customers and a relaxed feel.","ChIJw8soD6R1mxQRVWUnhBTbT2c":"Relaxed, inexpensive cafe on a square with indoor and outdoor tables, popular with locals for coffee, a drink or a light snack.","ChIJN6t5xYt1mxQR4muV-DaRWdU":"No frills old town grill specialising in meat, from sausages and ribs to mixed grills, with good Greek salads and great value. Only a few tables.","ChIJfRXW_KZ1mxQRo3w3piOsqBw":"Authentic kafeneio in the old town with simple, delicious meze; try the stuffed courgette flowers, omelette with staka or dakos. Friendly owner.","ChIJvTnB-sJ1mxQRADNzR6crKTg":"Seafront family taverna with fresh fish, good tzatziki and a shaded terrace. Most love it, but one reviewer called it a tourist trap that rushes you out.","ChIJ4RXUUql1mxQReNUSFs6wO_Y":"One of Crete's oldest bakeries, where you can watch pastry being stretched by hand. The baklava is superb and the family owners are charming.","ChIJnfXyD6R1mxQR_ZLmi5mBrgA":"Open paved square with a fountain near the Fortezza and the sea, with meze bars and cafes nearby. A pleasant stop, but little shade in summer.","ChIJbSJgOgB1mxQRC9toXUyzMRs":"Friendly little kafeneio with tasty meze, good wine and beer, and great value. An authentic taste of a real Greek bar.","ChIJZ_lN06B1mxQRt2-fi6CiGyg":"Pretty taverna down an alley near the harbour and fortress, with outdoor seating, fair prices and dishes like calamari and chicken in mustard sauce.","ChIJfY_Vk6h1mxQRdxojt7tbPYo":"Souvlaki spot popular with locals for fresh chicken pitta, beef souvlaki and gyros. Tables fill up fast and there's lots of takeaway trade.","ChIJ5-HMT6Z1mxQR8-C7CjV1rAE":"Large shady park in the town centre with benches, ancient trees and very loud cicadas. Hosts a Thursday market and occasional festivals.","ChIJ8VHIhBF1mxQR7KBBkA5eTso":"Big bakery cafe with a vast range of Cretan pastries, baklava, orange cake and good coffee. Great outdoor seating for breakfast.","ChIJT08Qi_F1mxQRerHlC52MtI8":"Beachside restaurant with sunset views, generous portions and a lovely mixed seafood platter. Welcoming to families; some dishes take around 20 minutes.","ChIJJYtL88F1mxQRnU1Fwbm4ZwU":"Well run beach spot with free sunbeds if you spend about €8 to €9 each, easy QR code ordering and fair prices. Arrive before 10am for a good spot.","ChIJfRgfOAx1mxQRQetaEXgprSg":"Beachside all day spot praised for generous gyros pitta and the best orange pie in town. One diner found the food frozen and poor value.","ChIJu14XtbZ1mxQREapqCqdz3t8":"Lively beach restaurant with big portions, fair prices and very welcoming, entertaining staff. Most love the food, though one pizza missed the mark.","ChIJ1aB9tRN1mxQRNB43YlJvJ0w":"Casual eatery opposite the beach by the port car park, serving excellent burgers, hot dogs, coffee and cocktails at fair prices. Quick, friendly service.","ChIJ62uIBRJ1mxQRM_5HLYNwHXQ":"Friendly restaurant with a terrace for watching the sunset, serving juicy chicken, mixed grills and burgers. Quick service, generous portions and fair prices.","ChIJc9qRAQ91mxQRuSPnEvRmFiE":"Homely spot for Greek home cooking, where you pick from the day's dishes at the counter. Huge portions and low prices, but short opening hours.","ChIJawtTyxN1mxQRlaGOeng44OM":"Pizzeria with a view, offering gluten free pizza and friendly staff. Reviews are mixed, with one report of a very long wait and a burnt base.","ChIJg-OZ56B1mxQRGCosglaJo_8":"Busy old town spot for pizza, crêpes, waffles and sandwiches at good prices. Can be slow at peak times because of lots of takeaway orders.","ChIJiYa0ujh1mxQR8aZ7ZwasqAI":"Elegant restaurant around an olive tree, serving modern Cretan dishes with a creative twist, such as grilled octopus and superb steak. Knowledgeable staff.","ChIJY3gmrzh1mxQReBML_iaV_Cc":"Warm family taverna in a garden setting with huge, affordable portions of Cretan food like moussaka and snails. Live music from the owner some evenings.","ChIJiXeczKukoRQRzz2ZFI7vGNg":"Friendly beach bar with free sunbeds if you order (about €4 minimum), fair prices and tasty drinks and bites. Food comes in plastic containers.","ChIJkVAPLo91mxQRUk_g8MFO08I":"Souvlaki house praised for superb gyros, generous portions and great value, around €10 to €15 for two. Check drink prices; one felt overcharged for beer.","ChIJByW1TYB1mxQRCEc7N6tEXU0":"Beach bar and restaurant with comfy sunbeds on a sandy beach, creative cocktails and good food. Friendly staff serve you right on the beach.","ChIJofztEg11mxQRY_BL8icD6hY":"Pastry shop a block from the beach with some of the best coffee nearby, sweet and savoury bakes and mini ice creams. Open on Sunday mornings.","ChIJEyAVhaB1mxQRp3yHXGHNtJ4":"Harbourside café with soft sofas and a lovely view, good for hot chocolate and milkshakes. Several reviewers warn of slow service and high prices for the view.","ChIJceUHEaF1mxQRH556F0vShyE":"Greek restaurant by the Fortezza entrance with a balcony view over town. Reviewers love the baked feta, the lamb and the warm, family style welcome.","ChIJ-VepmaB1mxQRdAYVl8GGc7Y":"Harbourfront restaurant with fine views of the lighthouse and friendly service. Food gets mixed reviews, with some finding it ordinary for the price.","ChIJdSciXIJ1mxQRZeBX0m0sinM":"Burger bar across the road from the sea, with heaters and covers on cooler nights. The mushroom and truffle burger gets rave reviews, though some found theirs dry.","ChIJpSQPaHV1mxQRquBkJlqB_oI":"Small family run diner serving home cooked Cretan food. Reviewers rave about the octopus stifado, generous portions and great value. Closed on Sundays.","ChIJWReCyKB1mxQRfffBg4uf07M":"Family confectioner going since 1950, mostly for takeaway. Famous for galaktoboureko, baklava and creamy sheep milk ice cream.","ChIJZ6LHN6d1mxQR_z9eTTFM2so":"Quiet café under the trees in a lane off the old town, praised for excellent coffee and cakes. One recent review says it may have closed.","ChIJd2NEM6F1mxQR1BN2a0Kqci4":"Friendly Greek restaurant with indoor and outdoor seating. Reviewers praise the fried calamari, beef stifado and quick service.","ChIJ2TDydQ51mxQRTe2YxNGWxGM":"Smart hotel restaurant on the seafront road, loved for its polished service. Reviewers praise the lamb ribs, sea bass and squid, beautifully presented.","ChIJ13evORJ1mxQRl5wsvOGiR3A":"Chinese restaurant on the seafront road with a sea view and a cosy feel. Reviewers praise the tasty dishes, fair portions and friendly staff.","ChIJEWhQfxR1mxQR3-1D_0QUkK0":"Relaxed beach taverna with sunbeds and a parasol for about 10 euros, and a very friendly host. Tasty tzatziki and chicken souvlaki, with cheap house wine.","ChIJwW2dWKB1mxQRiAllITpBcmM":"Seafront café with sea and sunset views, serving simple Greek food. Many enjoy it, but some reviewers felt pressured to stay and had trouble paying by card.","ChIJz9K0zqqkoRQR-yGOjXupBgI":"Small Mediterranean restaurant near the Fortezza, liked for its live music, quick polite service and fair prices. Only a handful of reviews so far.","ChIJ179SBaF1mxQRE2waNinCWkw":"Quiet terrace restaurant by the Fortezza with views over town and a passionate owner. Reviewers love the lamb in foil and the grilled prawns.","ChIJ09KrNAh1mxQRt6bOF-fgq_4":"Popular patisserie on the main avenue for cakes, pastries and ice cream, takeaway only. Reviewers rave about the galaktoboureko and the friendly team.","ChIJj63SkaB1mxQRvlPADqghqys":"Late night gyros spot known for a giant, cheap chicken pita. Reviews are mixed, with complaints of dry meat and rude, slow service.","ChIJJ7rtWBd1mxQRKKjydPJpAEU":"Non profit nature park on a hill above town, shown by friendly volunteer guides for a small donation. Taste herbs, meet a chameleon and enjoy the views. Steep walk up.","ChIJgeCH16B1mxQR94nsEYsLviw":"Hugely popular old town restaurant in a vine covered lane, loved for its meat dishes, generous portions and great wine tips. Booking is wise in the evening.","ChIJY6Yz66B1mxQRASTzRmuMgLY":"Busy grill house for souvlaki and pitas at good prices. Reviewers praise the huge portions and the Black Angus beef skewers. Closed Mondays.","ChIJZdxCEBJ1mxQRHgu2JDnoazk":"Seafront taverna specialising in seafood, with sea views and very friendly staff. Reviewers love the stuffed squid, seafood pasta and beef stifado.","ChIJyZP__Al1mxQR_WSQmlT62cw":"Craft beer bar with the best ale selection in town, including local Cretan brews. Music is kept at a chatty volume, and there is food and cocktails too.","ChIJQzPceqV1mxQRj5jhWc3CAMw":"Seafront taverna where you choose ready made dishes from the counter. Some enjoy the view, but several reviewers report rude service and poor food.","ChIJy-bBk6B1mxQRfN2L4xm-Uxw":"Hidden café terrace with a big araucaria tree growing through the roof. Reviewers love the calm, warm service, good coffee and cocktails.","ChIJ0Z-Dhg51mxQRsopIwaFvDBQ":"Family run taverna with sea views and superb service. Reviewers love the pastitsio, papoutsaki and fried calamari, with free raki to finish.","ChIJlfD8oKB1mxQRjm5QBp52v8I":"Basement club playing mainly Greek music into the early hours. Several reviewers complain that tourists pay a cover charge of around 15 euros while locals do not.","ChIJ6RcfM6d1mxQRPHg4sn2zqfs":"Busy old town grill for quick, cheap gyros pita with homemade chips. Reviewers praise the lamb kebab, fresh salads and fast service.","ChIJkecHdQp1mxQRRKLsSqCOtbw":"Harbourside seafood restaurant with a stunning setting. Be warned: reviewers call it badly overpriced, with surprise bills, so check the menu prices first.","ChIJpzl5G6d1mxQRBqC0pGC99so":"Homely old town spot for traditional Cretan cooking and breakfasts, popular with locals. Reviewers love the vegetarian platter for two. Closed Sundays.","ChIJ38uFLtx1mxQR_qFj37ZtJSI":"Newish beach bar with a great sea view, friendly staff and excellent cocktails. One reviewer found coffee and juice pricey for the quality.","ChIJMYyXug51mxQREo23uHag_og":"Family run grill house on the seafront, known for excellent value pita gyros. Sit upstairs on the balcony for sea views and less traffic noise.","ChIJEbwqLad1mxQRh-ZPQIFiPWQ":"Popular taverna in a little lane beside the mosque, made for sharing dishes. Reviewers praise the grilled dolmades, cheese saganaki and orange cake.","ChIJLeU2cgx1mxQRpkVPhr4k_Nk":"Statue of two dolphins, the symbol of Rethymno since ancient times, by the marina. Nice sea views, though reviewers note it sits in a rather scruffy car park.","ChIJJZ5OQKd1mxQRT7gw82ZnZAk":"Stylish wine bar on a quiet old town lane with a cosy terrace. Great Cretan and Greek wines by the glass and good food, though not the cheapest.","ChIJL19aCwl1mxQRiFIkzkuT-B0":"Corner restaurant and bar near the harbour, praised for cocktails, friendly service and good fish and chips. Some found the food rather ordinary.","ChIJyd92qKB1mxQRh1FYM4Hm5VQ":"Seafront restaurant serving creative Greek food with a modern twist. Reviewers praise the friendly staff, and nearly everything comes gluten free.","ChIJt_aFm3B1mxQRrEluqGN5W9E":"Seafront café bar with big screens for football. Reviews are poor overall, citing small portions, high prices, cash only payment and rude staff.","ChIJiSk1vEV1mxQRSWazv7JufXY":"Patisserie a short walk from the old town, loved for its cakes, trigona and goat milk ice cream. Friendly staff and fair prices.","ChIJxd7Sht51mxQR_zmwQWH5jY4":"Friendly little café loved for great coffee and bougatsa for breakfast. Reviewers praise the warm, hospitable service and low prices.","ChIJkfpZOBt1mxQRGxofu5LFCj0":"Tiny cocktail bar on a quiet lane with creative drinks, including tasty alcohol free ones. Friendly barman and fair prices, but few seats. Closed Sundays.","ChIJX7XZqih1mxQRyfZvYfus09I":"Seafront Greek restaurant with ocean views and fun, welcoming staff. Reviewers praise the fresh seafood and generous portions, with free dessert and a shot.","ChIJUdne_fV1mxQRusRrQ-dbFrE":"Asian fusion restaurant loved for fresh, tasty sushi at good prices and friendly service. Some found the curry and noodle sauces lacking flavour.","ChIJC4ZW96Z1mxQR_6fiHJQIKaI":"Old town restaurant with a lovely courtyard garden under fruit trees. Reviewers praise the fried squid and warm welcome, though it is a little pricey.","ChIJP7Zm7D11mxQRNh7INYFrNno":"Small pasta kitchen where the chef cooks fresh to order in front of you. Reviewers love the truffle pasta. Served in paper containers. Closed Tuesdays.","ChIJrdhuNwB1mxQRNRKoVZv7fvk":"Little lemonade stall on the seafront road with lots of fresh flavours at a good price. Reviewers recommend the lemon and ginger.","ChIJY32NIr11mxQReYC73DIniWE":"Hidden cocktail bar in the old town with artisan drinks and small plates. Reviewers rave about the signature H17 cocktail and the lovely staff.","ChIJmdsViER1mxQRGByXC1yt3K8":"Indian and Chinese restaurant in a quiet, shady lane, a nice change from grilled food. Reviewers praise the sizzling tandoori, samosas and fair prices.","ChIJBdoV26V1mxQRmpvpXGKQr6s":"Memorial to the Australian and Greek soldiers of the 1941 Battle of Crete, in a small shady park with pine trees and helpful history panels." erranean dishes.","ChIJy_NG86B1mxQRVzKAGiUhAPM":"Evening restaurant and bar on the calmer side of town with a lovely sea view. Praised for its steak and friendly feel, but food can take a very long time.","ChIJ_d-aVc91mxQRGNKwJVn-6S8":"Genuine local spot near the Fortezza, loved for excellent cheap gyros and souvlaki plus daily home cooked dishes like moussaka and rabbit stew.","ChIJS1OKkBF1mxQR9O8Ou80_nnU":"Grill house a few streets back from the beach, loved for huge mixed grill platters, great value and friendly, fast service.","ChIJs-Y9M6d1mxQRrhUzUTlpZ3w":"Gelato and dessert café praised for its pistachio Basque cheesecake, rich dark chocolate gelato and gluten free cones. Good coffee too.","ChIJ1ek0VqB1mxQRvfVBVcnfC2o":"Small local café in Rethymno.","ChIJb-7ulqB1mxQRsN4_rOG09b8":"Friendly rock bar with great rock and blues music, free bar snacks and big local beers. One reviewer found the drinks pricey.","ChIJOSjcPqF1mxQRCjaFjQZWOhc":"Friendly, well priced taverna a little off the main drag. Reviewers recommend the papoutsakia; one noted cutlery and glasses could be cleaner.","ChIJAcndlxN1mxQR75x67788vlI":"Restaurant, café and bar right by the beach, with sushi and billiards. Some loved a day here, but others found it overpriced with bland food and tiny cocktails.","ChIJDWhc8RN1mxQR3Ne2rwbc4h8":"Family run restaurant with rooms, known for warm hosts, good fish and pizza, and free ouzo and fruit after dinner. The road outside can be noisy.","ChIJaxUDwEV1mxQRat3Xzq5Z6v8":"Cheap coffee and snack stop near the bus station. Reviews are mixed, with some serious complaints about hygiene.","ChIJIVzGBKF1mxQRiIos3RRl-Fw":"Cosy restaurant on pretty blue steps with city views, serving creative takes on Greek dishes. Try the squid ink croquettes; service can be slow.","ChIJ1XLgowF1mxQRmYiLgHfaJ7E":"Busy central ice cream shop praised for creamy gelato, especially the pistachio, with lots of flavours and generous portions.","ChIJH-FawKB1mxQRXLjAnpLhWbE":"Family run gyros spot with great street food at low prices. Reviewers love the pitta gyros, mixed grill and friendly, speedy service.","ChIJ7aJNn6B1mxQR3RYrtnBJck8":"Lively bar in an old seafront building with happy hour, a DJ and dancing. Some report rude staff and watered down drinks, so check your bill.","ChIJO3rB_Ql1mxQR3ndqStTdNtY":"Italian restaurant praised for authentic Neapolitan pizza, fresh pasta and outstanding, friendly service. Often called one of the old town's best.","ChIJE1hNLfp1mxQR7REFZapNDCw":"Indian restaurant praised for onion bhajis, butter chicken and garlic naan, with kind, friendly service. One reviewer found the biryani bland.","ChIJ9595r6Z1mxQR5JhadzuLN3E":"Relaxed cooperative grill on a quiet street, loved for its falafel wraps and pittas, fresh food, old Greek music and great prices.","ChIJxbaFMwl1mxQRVPXgDq3Ya88":"Patisserie just behind the seafront with a wonderful display of cakes, eclairs, cheesecakes and ice creams, all high quality and great value.","ChIJy0SwKqd1mxQRqtaGH34byYQ":"Cosy old town taverna with warm service, good wines and free dessert and raki. Food gets mixed views; the smoked pork and baked cheese stand out.","ChIJST6atw51mxQRQtfX5BJWCCs":"Family run lunch spot where you pick from pots of home cooked food. Loved by locals for moussaka and stuffed peppers; dishes sell out, so go early.","ChIJTTAnTFN1mxQRwMq6Jr49ZKc":"Asian fast food bar where you build your own wok box. Friendly service, but many reviewers found the food disappointing and poor value.","ChIJ5YaAdQ51mxQRWzFFyWbRBVk":"Seafront café bar with sea views, fresh juices, brunch, ice cream and sunbeds on the beach. A few found the food overpriced for the portions.","ChIJT15Ys511mxQRkdHo6ElsYqY":"Cosy music café in a candlelit alley run by a warm mother and daughter. Loved for home cooked food, vegan options, cocktails and live music.","ChIJBwMPQAh1mxQRRTm5oCMED1U":"Old fashioned charcoal grill taverna praised for its lamb chops, pork belly and meatballs at good value. A few reviewers had a poor meal.","ChIJAfZuhXF1mxQRMv294GP37yM":"Frozen yoghurt and ice cream shop with fresh toppings and very friendly owners, who are clued up on allergies and gluten free options.","ChIJr9zPLKd1mxQRJro_4gOIUIE":"Old town restaurant serving Cretan cooking with kind, funny staff. Reviewers rave about the Mediterranean salad and grilled octopus; it can be noisy.","ChIJaQG3-A11mxQRMYUzwFy6uQY":"Family run bar with sea views and strong cocktails, handy for watching football. Food and service get mixed reviews, with some finding staff rude.","ChIJq6rqCgl1mxQRQkDcNCT-zVY":"Busy restaurant on a square overlooking the harbour, with generous portions, good pitta gyros and fair prices. Service can be stretched and food is hit and miss.","ChIJMeaEBRJ1mxQRYXr9qAzldHk":"Beach restaurant with a great beer selection, gyros wraps and sunbeds with table service. Reviewers praise the friendly, attentive staff.","ChIJ0dhYYad1mxQRDhrOJUkitmM":"Homely old town taverna with generous Cretan cooking, low prices and live folk music in the evenings. It is small, and food can be slow when busy.","ChIJXXhMG-91mxQRbeaDWA6XvM0":"Proper taverna in a quiet alley with a lovely owner cooking homemade food. Praised for huge moussaka and aubergine with trahana; one found portions small.","ChIJXZn86u91mxQR4zmrFthbZRo":"Small sushi bar for a change from Greek food, mostly praised for tasty rolls and friendly service. No air conditioning and a few very bad reviews.","ChIJBUcmv9N1mxQRgFVWj2bvAcA":"Stylish restaurant with a modern take on Cretan food. Reviewers rave about the grilled sea bass, smoked feta and calamari gyros, but it is pricey.","ChIJg0crFZR1mxQR559hbncL0_k":"Charming old town restaurant down a flowery alley, loved for tender lamb shank, octopus, veggie options and a free dessert. Fair prices.","ChIJ7TETpQB1mxQRSNiCRtoHUjI":"Old school Greek café with homemade food, wine and lemonade, very hospitable owners and sometimes live rebetiko music.","ChIJU_oiuwl1mxQRAotM2Hdfgh0":"Restored mosque from the days of Turkish rule, a beautiful piece of the town's history. Reviewers say it is usually closed inside.","ChIJv4DPXxV1mxQR3MnUJwiKX7M":"Friendly, busy taverna with generous meze, fair prices and a roof that opens to the sky. Service can be slow at peak times."};for(const p of PLACES){if(!p.b&&DESC[p.id])p.b=DESC[p.id]}}
