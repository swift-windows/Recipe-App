name: Deploy survey app to GitHub Pages

on:
  push:
    branches: [claude/window-measurement-quote-app-qr3o0o]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The survey logic decides what gets ordered - never ship it red.
      - name: Test
        run: npm test

      - name: Build single-file bundle
        run: node build.js

      # Ship the app, not the source tree: no README, no tests, no build script.
      - name: Assemble site
        run: |
          mkdir -p _site/dist
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js icons _site/
          cp dist/survey.html _site/dist/survey.html
          ls -R _site

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo the first time this runs, so no manual
          # trip to Settings is needed.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
