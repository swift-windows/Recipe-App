name: Deploy survey app to GitHub Pages

on:
  push:
    branches: [claude/window-measurement-quote-app-qr3o0o]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The survey logic decides what gets ordered - never ship it red.
      - name: Test
        run: npm test

      - name: Build single-file bundle
        run: node build.js

      # Ship the app, not the source tree: no README, no tests, no build script.
      - name: Assemble site
        run: |
          mkdir -p _site/dist
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js icons _site/
          cp dist/survey.html _site/dist/survey.html
          cp -r rethymno _site/rethymno
          ls -R _site

      # Enabling Pages itself needs administration:write, which the Actions
      # token does not have and `permissions:` cannot grant - so this step
      # cannot switch Pages on by itself. It is a no-op once Pages is on.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Explain a Pages-not-enabled failure
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error::Pages is not enabled for this repository."
          echo "Fix it once, by hand: Settings -> Pages -> Build and deployment ->"
          echo "Source: GitHub Actions. Then re-run this workflow."
          echo "This step cannot do it: creating a Pages site requires"
          echo "administration:write, which GITHUB_TOKEN does not carry."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
