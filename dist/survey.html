<style>
/*
 * Built for a phone held in one hand in someone's hallway:
 * large targets, high contrast, nothing that needs a precise tap.
 */

:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --ink: #14202b;
  --ink-soft: #5b6b7a;
  --line: #d8e0e7;
  --brand: #0f2b46;
  --brand-ink: #ffffff;
  --accent: #1a7fc1;
  --warn-bg: #fff6e5;
  --warn-line: #f0c26b;
  --danger: #b3261e;
  --glass: #dceaf4;
  --glass-obs: #cbdde9;
  --radius: 12px;
  --tap: 48px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10161c;
    --card: #18212a;
    --ink: #e8eef4;
    --ink-soft: #9bacbb;
    --line: #2b3946;
    --brand: #0b2137;
    --glass: #22394b;
    --glass-obs: #2b4356;
    --warn-bg: #3a2f16;
    --warn-line: #7a5f22;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

/* ---------- layout ---------- */

.screen { min-height: 100vh; }

.screen__body {
  padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
  background: var(--brand);
  color: var(--brand-ink);
}

.topbar__title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.topbar__title strong { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar__sub { font-size: 12px; opacity: .78; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.topbar .btn { background: rgba(255,255,255,.14); color: var(--brand-ink); border-color: transparent; }
.topbar .btn--primary { background: var(--accent); }
.topbar__danger { background: rgba(255,255,255,.14) !important; color: #ffd7d4 !important; }

.spacer { height: 40px; }
.section-title { margin: 6px 2px -4px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.empty { color: var(--ink-soft); text-align: center; padding: 28px 12px; }

/* ---------- cards ---------- */

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card--warn { background: var(--warn-bg); border-color: var(--warn-line); }
.card--draw { align-items: stretch; }
.card__title { margin: 0; font-size: 15px; }
.card__subtitle { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); }
.hint { margin: 0; font-size: 12.5px; color: var(--ink-soft); }
.list { margin: 0; padding-left: 18px; font-size: 14px; }
.list li { margin-bottom: 4px; }

/* ---------- form ---------- */

.row { display: flex; gap: 10px; }
.row--2 > * { flex: 1 1 0; min-width: 0; }
.row--wrap { flex-wrap: wrap; align-items: center; }

.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; min-width: 0; }
.field__label { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
.field__hint { font-size: 12px; color: var(--ink-soft); }

.input {
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px 12px;
  min-height: var(--tap);
  width: 100%;
}
textarea.input { min-height: 72px; resize: vertical; }
.input:focus { outline: 3px solid var(--accent); outline-offset: 1px; }

.toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 0 4px;
  font-size: 14px;
}
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }

/* ---------- buttons ---------- */

.btn {
  font: inherit;
  font-weight: 600;
  min-height: var(--tap);
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn--tool { background: var(--bg); }
.btn--danger { color: #fff; background: var(--danger); border-color: transparent; }
.btn--block { width: 100%; }
.btn[disabled] { opacity: .6; }

/* ---------- home list ---------- */

.rowcard {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  min-height: 64px;
  cursor: pointer;
}
.rowcard__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rowcard__sub { font-size: 12.5px; color: var(--ink-soft); }

.pill {
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--bg);
  color: var(--ink-soft);
  white-space: nowrap;
}
.pill--warn { background: var(--warn-bg); color: #8a5b00; border: 1px solid var(--warn-line); }

/* ---------- item cards ---------- */

.itemcard {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.itemcard__hit {
  display: flex;
  gap: 12px;
  width: 100%;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: none;
  border: 0;
  padding: 12px;
  cursor: pointer;
}
.itemcard__thumb { width: 92px; flex: 0 0 92px; }
.itemcard__thumb .ev { width: 100%; height: auto; }
.itemcard__meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.itemcard__meta .pill { align-self: flex-start; margin-top: 4px; }
.itemcard__actions { display: flex; gap: 8px; padding: 0 12px 12px; }

/* ---------- the drawing ---------- */

.canvas { display: flex; justify-content: center; padding: 4px 0; }
.ev { width: 100%; max-width: 420px; height: auto; touch-action: manipulation; }

.ev-frame { fill: none; stroke: var(--ink); stroke-width: 9; }
.ev-bar { fill: var(--ink); }
.ev-bar--french { fill: var(--accent); }
.ev-glass { fill: var(--glass); }
.ev-glass--obscure { fill: var(--glass-obs); }
.ev-hatch { stroke: var(--ink-soft); stroke-width: .7; opacity: .5; }
.ev-lead { stroke: var(--ink-soft); stroke-width: .9; opacity: .65; }
.ev-sash { fill: none; stroke: var(--ink); stroke-width: 6; }
.ev-sash--dummy { stroke-dasharray: 7 5; }
.ev-open { fill: none; stroke: #0a8a3c; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.ev-leaf { stroke: var(--ink); stroke-width: 5; }
.ev-glazbar { stroke: var(--ink); stroke-width: 2; opacity: .75; }
.ev-knob { fill: #0a8a3c; }
.ev-vent { fill: var(--ink-soft); }
.ev-mark { font-size: 11px; font-weight: 700; fill: var(--ink-soft); }
.ev-dim { stroke: var(--ink-soft); stroke-width: 1.2; }
.ev-dimtxt { font-size: 13px; font-weight: 700; fill: var(--ink); }
.ev-subdim { font-size: 11px; fill: var(--ink-soft); }

.ev-hit { fill: transparent; cursor: pointer; }
.ev-hit:hover { fill: rgba(26,127,193,.12); }
.ev-hit:focus { outline: none; fill: rgba(26,127,193,.2); }
.ev-hit.is-selected { fill: rgba(26,127,193,.24); }

.counts { margin: 0; text-align: center; font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tools .btn { flex: 1 1 44%; }

/* ---------- photos ---------- */

.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photos__cell { position: relative; }
.photos__img { width: 92px; height: 92px; object-fit: cover; border-radius: 9px; border: 1px solid var(--line); }
.photos__del {
  position: absolute; top: -6px; right: -6px;
  min-height: 30px; width: 30px; padding: 0;
  border-radius: 999px; background: var(--danger); color: #fff; border: 0;
  font-size: 15px; line-height: 1;
}

/* ---------- bottom sheet ---------- */

.sheet {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(4, 12, 20, .45);
  display: flex; align-items: flex-end;
  opacity: 0; transition: opacity .18s ease;
}
.sheet.is-open { opacity: 1; }
.sheet__panel {
  width: 100%;
  max-height: 88vh;
  background: var(--card);
  border-radius: 16px 16px 0 0;
  display: flex; flex-direction: column;
  transform: translateY(14px);
  transition: transform .18s ease;
}
.sheet.is-open .sheet__panel { transform: none; }
.sheet__head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px; border-bottom: 1px solid var(--line);
}
.sheet__title { margin: 0; font-size: 15px; flex: 1; }
.sheet__body {
  padding: 12px calc(12px) calc(24px + env(safe-area-inset-bottom));
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
}
.sheet__sub { margin: 6px 0 0; font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }

/* ---------- opener picker ---------- */

.openers { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.opener {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 6px;
  font: inherit; font-size: 11.5px; font-weight: 600; text-align: center;
  color: var(--ink);
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
  min-height: 92px;
}
.opener.is-on { border-color: var(--accent); background: rgba(26,127,193,.12); }
.opener__sym { display: block; width: 54px; color: var(--ink); }
.sym { width: 100%; height: auto; }

/* ---------- product picker ---------- */

.picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.picker__btn {
  display: flex; flex-direction: column; gap: 2px;
  text-align: left; font: inherit;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 12px; min-height: 62px; cursor: pointer;
}
.picker__sub { font-size: 11.5px; color: var(--ink-soft); }

/* ---------- report ---------- */

.preview {
  margin: 0;
  max-height: 50vh;
  overflow: auto;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px;
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ---------- toast ---------- */

.toast {
  position: fixed;
  left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
  transform: translate(-50%, 16px);
  z-index: 90;
  background: var(--ink); color: var(--bg);
  padding: 12px 16px; border-radius: 10px;
  font-size: 14px; max-width: 90vw; text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

.visually-hidden {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

</style>

/*
 * model.js - pure, DOM-free data model for a Swift Windows site survey.

 * Everything in here is deliberately free of browser APIs so it can be unit
 * tested under node (tools/selftest.mjs) and reused by any exporter.
 *
 * The structure mirrors how Tommy Trinder's VS2 configurator actually builds a
 * frame, so a survey converts into build steps with no interpretation:
 *
 *   item.columns[]        -> the vertical mullions you draw on the VS2 canvas
 *   column.rows[]         -> the transoms within that column (partial transoms
 *                            are the normal case, so transoms are per column)
 *   pane.opener           -> the tile you pick in the "Opener at Pane X" dialog
 */

const SCHEMA = 'swift-survey/v1';

/* ------------------------------------------------------------------ *
 * Catalogue - keys match the product tiles in Tommy Trinder
 * ------------------------------------------------------------------ */

const PRODUCTS = [
  // family 'casement' uses the freehand grid builder (VS2 step 5a)
  { key: 'upvc-casement',        label: 'uPVC Casement',              family: 'casement',  tt: '*uPVC Casement',                       tab: 'PVCu' },
  { key: 'upvc-flush',           label: 'uPVC Flush Casement',        family: 'casement',  tt: '*uPVC Flush Casement',                 tab: 'PVCu' },
  { key: 'alu-casement',         label: 'Sheerline Classic Casement', family: 'casement',  tt: '*Sheerline Classic Beaded Casement',   tab: 'Aluminium' },
  { key: 'alu-flush',            label: 'Sheerline Classic Flush',    family: 'casement',  tt: '*Sheerline Classic Flush Beaded Casement', tab: 'Aluminium' },
  { key: 'tilt-turn',            label: 'Tilt & Turn Window',         family: 'casement',  tt: 'Tilt Turn Window',                     tab: 'PVCu' },
  { key: 'timber-casement',      label: 'Timber Stormproof Casement', family: 'casement',  tt: '3. Stormproof Casement',               tab: 'Timber' },

  // doors
  { key: 'comp-door',            label: 'Composite Door',             family: 'composite', tt: '*Comp Door Composite Door',            tab: 'PVCu' },
  { key: 'upvc-entrance',        label: 'uPVC Entrance Door',         family: 'door',      tt: '*uPVC Entrance Door',                  tab: 'PVCu' },
  { key: 'upvc-french',          label: 'uPVC French Door',           family: 'door',      tt: '*uPVC French Door',                    tab: 'PVCu' },
  { key: 'alu-french',           label: 'Aluminium French Door',      family: 'door',      tt: 'Sheerline Prestige French Door',       tab: 'Aluminium' },

  // pickers rather than freehand
  { key: 'bifold',               label: 'Bi-fold Door',               family: 'bifold',    tt: '*Alunet Bifold',                       tab: 'Aluminium' },
  { key: 'patio-slider',         label: 'Patio / Sliding Door',       family: 'slider',    tt: 'Smart Visoglide Slider',               tab: 'Aluminium' },
  { key: 'upvc-patio',           label: 'uPVC Patio Door',            family: 'slider',    tt: '*uPVC Patio Door',                     tab: 'PVCu' },
  { key: 'sash-roseview',        label: 'Sliding Sash (Roseview)',    family: 'sash',      tt: 'Heritage Rose',                        tab: 'Roseview' },
  { key: 'sash-bereco',          label: 'Sliding Sash (Bereco)',      family: 'sash',      tt: 'Bereco Traditional Sliding Sash',      tab: 'Bereco' },
  { key: 'sash-timberlook',      label: 'Timberlook Flush Sash',      family: 'sash',      tt: 'Timberlook Flush Sash Window',         tab: 'Timberlook' },

  // coupled / bay - a bay IS a coupled item set to Angled
  { key: 'bay',                  label: 'Bay / Bow (coupled)',        family: 'bay',       tt: 'PVC Coupled Item',                     tab: 'PVCu' },
  { key: 'coupled-flat',         label: 'Coupled Item (flat)',        family: 'bay',       tt: 'PVC Coupled Item',                     tab: 'PVCu' },

  // ancillaries - these skip VS2 entirely (Parts Shop)
  { key: 'parts',                label: 'Extra / Parts Shop item',    family: 'parts',     tt: 'Parts Shop',                           tab: 'Parts Shop' }

function product(key) {
  return PRODUCTS.find(p => p.key === key) || PRODUCTS[0];
}

/* ------------------------------------------------------------------ *
 * Openers - the four tiles in VS2's "Opener at Pane X" dialog, plus
 * the states you get before you touch it.
 * ------------------------------------------------------------------ */

const OPENERS = {
  fixed:      { label: 'Fixed',                      short: 'F',   symbol: 'none',   vs2: 'Leave pane untouched (no sash)' },
  sideLeft:   { label: 'Side-hung, hinge left',      short: 'SHL', symbol: 'left',   vs2: 'Opener dialog: TOP-RIGHT tile (side-hung hinge-left)' },
  sideRight:  { label: 'Side-hung, hinge right',     short: 'SHR', symbol: 'right',  vs2: 'Opener dialog: TOP-LEFT tile (side-hung hinge-right)' },
  topHung:    { label: 'Top-hung',                   short: 'TH',  symbol: 'up',     vs2: 'Opener dialog: BOTTOM-LEFT tile (top-hung)' },
  bottomHung: { label: 'Bottom-hung',                short: 'BH',  symbol: 'down',   vs2: 'Opener dialog: bottom-hung (check availability on profile)' },
  tiltTurn:   { label: 'Tilt & turn',                short: 'T&T', symbol: 'tilt',   vs2: 'Tilt & Turn product only' },
  dummy:      { label: 'Dummy sash (fixed, sashed)', short: 'D',   symbol: 'dummy',  vs2: 'Opener dialog: BOTTOM-RIGHT tile (Dummy)' }
};

const OPENER_KEYS = Object.keys(OPENERS);

/** Openers that actually open - used for the shootbolt / hinge count cross-check. */
function isOpening(key) {
  return key !== 'fixed' && key !== 'dummy';
}

/* ------------------------------------------------------------------ *
 * Glass
 * ------------------------------------------------------------------ */

const OBSCURE_PATTERNS = ['None (clear)', 'Satin', 'Stippolyte', 'Cotswold', 'Everglade', 'Minster', 'Pelerine', 'Contora'];
const BAR_TYPES = ['None', 'Georgian', 'Astragal', 'Leaded', 'Diamonds'];

function newGlass() {
  return {
    obscure: 'None (clear)',
    toughened: false,
    leaded: false,
    bars: 'None',
    barRows: 0,
    barCols: 0,
    trickleVent: false,
    notes: ''
  };
}

/* ------------------------------------------------------------------ *
 * Constructors
 * ------------------------------------------------------------------ */

let seq = 0;
/** Deterministic-ish id. Not security relevant. */
function uid(prefix = 'id') {
  seq += 1;
  return `${prefix}-${Date.now().toString(36)}-${seq.toString(36)}`;
}

function newPane() {
  return { id: uid('pane'), opener: 'fixed', glass: newGlass(), assumed: false, notes: '' };
}

function newColumn(rows = 1) {
  return {
    id: uid('col'),
    width: null,                       // mm, optional - only when sections are unequal
    rows: Array.from({ length: rows }, () => ({ id: uid('row'), height: null, pane: newPane() }))
  };
}

function newItem(patch = {}) {
  const item = {
    id: uid('item'),
    ref: '',
    location: '',
    productKey: 'upvc-casement',
    jobType: 'Supply & Fit - Remove & replace',
    quantity: 1,
    width: null,                       // mm - Basic Frame Size, NOT overall incl. cill
    height: null,
    sillHeightFromFloor: null,         // mm - drives the critical-location check
    columns: [newColumn(1)],
    frenchMullion: false,
    finish: { frame: '', sash: '', cill: '' },
    cill: '',

    el('h3', { class: 'card__title', text: 'Summary' }),
    el('ul', { class: 'list' }, [
      el('li', { text: `${survey.items.length} item${survey.items.length === 1 ? '' : 's'}` }),
      el('li', { text: `${families.length} frame${families.length === 1 ? '' : 's'} to build, the rest duplicated` }),
      el('li', { text: `${survey.items.reduce((n, i) => n + openingCount(i), 0)} opening sashes in total` })
    ])
  ]));

  body.appendChild(el('section', { class: 'card' }, [
    el('h3', { class: 'card__title', text: 'Send it' }),
    el('p', { class: 'hint', text: 'Send this to Claude and say “quote this up in Tommy Trinder”. The report carries the build steps and a structured payload, so nothing has to be re-typed.' }),
    el('div', { class: 'row row--wrap' }, [
      button('Share', () => out.share(survey, md, summary), { variant: 'primary' }),
      button('Copy report', () => out.copy(md), { variant: 'primary' }),
      button('Download .md', () => out.download(md, out.fileName(survey, 'md')), { variant: 'tool' }),
      button('Download .json', () => out.download(JSON.stringify(toPayload(survey), null, 2), out.fileName(survey, 'json'), 'application/json'), { variant: 'tool' }),
      button('Email', () => out.mailto(survey, store.settings().sendEmail, summary), { variant: 'tool' })
    ]),
    store.settings().postUrl
      ? button('Send to Swift Hub', async e => {
        const s = store.settings();
        const btn = e.target;
        btn.disabled = true;
        btn.textContent = 'Sending…';
        try {
          await out.post(s.postUrl, s.postToken, { markdown: md, payload: toPayload(survey) });
          toast('Sent');
        } catch (err) {
          console.error(err);
          toast(`Send failed: ${err.message}`);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send to Swift Hub';
        }
      }, { variant: 'primary' })
      : null
  ]));

  body.appendChild(el('section', { class: 'card' }, [
    el('h3', { class: 'card__title', text: 'Preview' }),
    el('pre', { class: 'preview', text: md })
  ]));

  body.appendChild(el('div', { class: 'spacer' }));
  return wrap;
}

/* ------------------------------------------------------------------ *
 * Settings
 * ------------------------------------------------------------------ */

function settingsScreen() {
  const wrap = el('div', { class: 'screen' });
  const s = store.settings();
  wrap.appendChild(el('header', { class: 'topbar' }, [
    button('‹ Back', () => go('home'), { class: 'topbar__back' }),
    el('div', { class: 'topbar__title' }, [el('strong', { text: 'Settings' })])
  ]));
  const body = el('div', { class: 'screen__body' });
  wrap.appendChild(body);

  body.appendChild(el('section', { class: 'card' }, [
    el('h3', { class: 'card__title', text: 'Defaults for new surveys' }),
    field('Surveyor name', s.surveyor, v => store.saveSettings({ surveyor: v })),
    field('Frame finish', s.defaultFinish, v => store.saveSettings({ defaultFinish: v })),
    field('Cill', s.defaultCill, v => store.saveSettings({ defaultCill: v })),
    field('Handles', s.defaultHandle, v => store.saveSettings({ defaultHandle: v }))
  ]));

  body.appendChild(el('section', { class: 'card' }, [
    el('h3', { class: 'card__title', text: 'Sending' }),
    field('Email reports to', s.sendEmail, v => store.saveSettings({ sendEmail: v }), { type: 'email', inputmode: 'email' }),
    field('Post endpoint (optional)', s.postUrl, v => store.saveSettings({ postUrl: v }), {
      placeholder: 'https://…/api/survey',
      hint: 'Leave blank and nothing ever leaves the phone automatically. Set it to post the report straight to the Swift Hub.'
    }),
    field('Endpoint token', s.postToken, v => store.saveSettings({ postToken: v }), { type: 'password' })
  ]));

  body.appendChild(el('section', { class: 'card' }, [
    el('h3', { class: 'card__title', text: 'Data' }),
    el('p', { class: 'hint', text: 'Surveys live on this device only. Export a backup before clearing browser data or changing phone.' }),
    el('div', { class: 'row row--wrap' }, [
      button('Export all surveys', () => {
        out.download(JSON.stringify(store.loadAll(), null, 2), 'swift-surveys-backup.json', 'application/json');
      }, { variant: 'tool' }),
      button('Import backup', () => importBackup(), { variant: 'tool' })
    ])
  ]));

  body.appendChild(el('div', { class: 'spacer' }));
  return wrap;
}

function importBackup() {
  const input = el('input', {
    type: 'file', accept: 'application/json', class: 'visually-hidden',
    onchange: e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const list = JSON.parse(reader.result);
          if (!Array.isArray(list)) throw new Error('not a survey backup');
          const existing = store.loadAll();
          const byId = new Map(existing.map(s => [s.id, s]));
          list.forEach(s => byId.set(s.id, s));
          store.saveAll([...byId.values()]);
          toast(`Imported ${list.length} survey(s)`);
          render();
        } catch (err) {
          toast(`Could not import: ${err.message}`);
        }
      };
      reader.readAsText(file);
    }
  });
  document.body.appendChild(input);
  input.click();
  setTimeout(() => input.remove(), 60000);
}

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */

render();


};

  require('./app.js');
})();
</script>
